openapi: 3.2.0

info:
  title: ICustomerIdentity — CoreTransaccional
  summary: Identidad y consentimiento de clientes de Solventa.
  description: |
    API **interna** del submódulo *Identidad y Consentimiento* de CoreTransaccional.

    Responsabilidades:
    - Alta y consulta de clientes, enlazados con su identidad de autenticación (`identityRef`).
    - Gestión de consentimientos de acceso a datos por *scope* (Open Finance / Open Data).

    Consumidores:
    - **BFF Web / Móvil** — registro y pasos del journey de originación.
    - **Perfilamiento** — valida el consentimiento vigente antes de construir el perfil (EXP-02).

    No es una API pública. Se expone solo dentro de la malla del clúster; el borde
    (LB → WAF → API Gateway) no la enruta hacia Internet.

    Errores en formato **RFC 9457 (Problem Details)**, `application/problem+json`.
  version: 0.1.0
  contact:
    name: Equipo 4Bits
  license:
    name: Uso académico MISW4501

servers:
  - url: http://svc-core.core.svc.cluster.local
    description: Servicio interno (in-cluster)
  - url: https://core.dev.solventa4bits.com
    description: Entorno de desarrollo (a través del gateway interno)

tags:
  - name: Clientes
    description: Alta y consulta de clientes.
  - name: Consentimientos
    description: Otorgamiento, consulta y revocación de consentimientos por scope.
  - name: Evidencias de identidad
    description: Cédula por ambas caras y selfie previas a la firma (BITS-275).
  - name: Pólizas
    description: Solicitud, consulta y documento de las pólizas de un cliente (BITS-101).
  - name: Pólizas (backoffice)
    description: Cola de pólizas de todos los clientes y decisión del personal de Solventa.
  - name: Dispositivos
    description: Dispositivos de los clientes para los avisos push (BITS-229).
  - name: Usuarios internos
    description: Cuentas del personal de Solventa, administradores y socios (BITS-374).
  - name: Siniestros
    description: Reporte de siniestros del cliente (BITS-381).
  - name: Siniestros (backoffice)
    description: Bandeja del ADMIN, archivos y decisiones sobre los siniestros (BITS-377).

security:
  - serviceAuth: []

paths:
  /v1/clientes:
    get:
      operationId: buscarClientePorIdentidad
      tags: [Clientes]
      summary: Busca un cliente por su identidad, su correo o su documento
      description: |
        - `identityRef` (el `sub` de Identity Platform), solo: lo usa el BFF para asociar la sesión
          con el `clienteId` tras el login. No se mezcla con lo demás (`400`).
        - `correo`, o `tipoDocumento` y `numeroDocumento` juntos, o **los dos a la vez**: el socio
          busca a quién venderle (BITS-378). El correo no distingue mayúsculas. `400` si no llega
          ninguno o si el tipo viene sin el número.

        Con correo y documento a la vez deben ser de la misma cuenta: si son de cuentas distintas,
        o el correo es de una cuenta y el documento no es de nadie, `409 CLIENTES_DISTINTOS` con el
        campo que choca (`errores[0].campo`). Si solo el documento existe, devuelve esa cuenta.

        `404` si no hay ningún cliente con ese dato.
      parameters:
        - name: identityRef
          in: query
          required: false
          schema: { type: string, maxLength: 128 }
        - name: correo
          in: query
          required: false
          schema: { type: string, maxLength: 254 }
        - name: tipoDocumento
          in: query
          required: false
          schema: { $ref: '#/components/schemas/TipoDocumento' }
        - name: numeroDocumento
          in: query
          required: false
          schema: { type: string, minLength: 4, maxLength: 20 }
      responses:
        '200':
          description: Cliente encontrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cliente' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: El correo y el documento son de cuentas distintas (`codigo = CLIENTES_DISTINTOS`, `errores[0].campo` dice cuál choca).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
    post:
      operationId: registrarCliente
      tags: [Clientes]
      summary: Registra un cliente
      description: |
        Crea el registro de cliente en estado `ACTIVO` y lo enlaza con la identidad
        de autenticación (`identityRef`). Crea atómicamente los consentimientos
        `OPEN_DATA` (tratamiento de datos personales) y `OPEN_FINANCE` (datos
        financieros) a partir de `autorizaTratamientoDatos` y
        `autorizaDatosFinancieros` — ninguno de los dos bloquea el registro
        (BITS-93 AC-9): declinarlos solo deja el consentimiento correspondiente en
        `NO_OTORGADO`.

        Valida que el dominio del correo no esté en la lista de dominios desechables
        (AC-7) y que ni el correo ni el documento ya existan (AC-5) — responde `409`
        indicando el campo en conflicto sin revelar más datos del otro cliente.

        Idempotente por (`tipoDocumento`, `numeroDocumento`): si el cliente ya existe
        responde `409` sin modificar nada. Con `Idempotency-Key`, un reintento con la
        misma clave devuelve la respuesta original `201`.

        Publica el evento de dominio `ClienteRegistrado` (incluye el resultado del
        consentimiento financiero, lo consume Perfilamiento para decidir si consulta
        Open Finance).

        Tras responder, en segundo plano y sin afectar esta respuesta, prepara los
        correos de **bienvenida** y de **verificación de correo** (plantilla de
        Productos rellenada con los datos del cliente y el enlace a la web) y los
        publica como eventos `EnviarCorreo` para la función `fn-notificaciones`.
        Si algo de eso falla, el registro queda igual; el fallo solo se registra.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistrarClienteRequest' }
      responses:
        '201':
          description: Cliente creado.
          headers:
            Location:
              description: URI del cliente creado.
              schema: { type: string, format: uri-reference }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cliente' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/EntidadNoProcesable' }

  /v1/clientes/asistidos:
    post:
      operationId: crearClienteAsistido
      tags: [Venta directa]
      summary: Da de alta a un cliente que un socio atiende en el backoffice (BITS-378)
      description: |
        **Interno**: lo llama bff-web desde la ruta que exige el rol `SOCIO`. Crea la cuenta del
        cliente en Identity Platform con el correo ya verificado y una contraseña temporal que
        genera Core (el socio no la ve), registra al cliente por el canal `BACKOFFICE` con el
        correo confirmado y **sin ninguna autorización de datos**: el cliente no las dio, así
        que Perfilamiento no consulta nada hasta que él las otorgue.

        Responde `409` con `errores[].campo` (`correo` o `documento`) si ya hay un cliente, o si
        el correo ya tiene una cuenta en Identity Platform. Si el registro falla después de
        crear la cuenta, esta se borra. Con `Idempotency-Key`, un reintento devuelve la respuesta
        original `201` sin crear nada ni mandar otro correo.

        Tras responder, en segundo plano, publica la **bienvenida** (`bienvenida-venta`) y los datos
        de acceso (`cuenta-activada`, con el correo y la contraseña temporal). Salen aquí y no con
        la venta: solo el cliente nuevo los necesita. La contraseña no vuelve en la respuesta ni se
        guarda.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CrearClienteAsistidoRequest' }
      responses:
        '201':
          description: Cliente creado.
          headers:
            Location:
              description: URI del cliente creado.
              schema: { type: string, format: uri-reference }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cliente' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '503':
          description: Identity Platform no está disponible. No se creó nada.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
      security:
        - serviceAuth: []

  /v1/clientes/disponibilidad:
    get:
      operationId: consultarDisponibilidad
      tags: [Clientes]
      summary: Consulta si un correo y/o documento ya están registrados
      description: |
        Chequeo de solo lectura para validación en vivo del formulario de registro
        (BITS-93). No reemplaza la validación atómica de unicidad que hace
        `POST /v1/clientes` en el momento de crear — esta consulta es una ayuda de UX,
        sujeta a condiciones de carrera.
      parameters:
        - name: correo
          in: query
          required: false
          schema: { type: string, format: email, maxLength: 254 }
        - name: tipoDocumento
          in: query
          required: false
          schema: { $ref: '#/components/schemas/TipoDocumento' }
        - name: numeroDocumento
          in: query
          required: false
          schema: { type: string, minLength: 4, maxLength: 20 }
      responses:
        '200':
          description: Disponibilidad de los campos consultados.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Disponibilidad' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }

  /v1/clientes/{clienteId}/confirmacion:
    parameters:
      - $ref: '#/components/parameters/ClienteId'
    post:
      operationId: confirmarCliente
      tags: [Clientes]
      summary: Confirma el correo del cliente
      description: |
        Transiciona el cliente a `correoConfirmado = true` (BITS-93 AC-3). Lo invoca
        el BFF una vez Identity Platform valida el enlace de activación — el
        vencimiento del enlace lo controla Identity Platform con su comportamiento
        por defecto, esta operación no impone una ventana propia.

        Idempotente: confirmar una cuenta ya confirmada no falla, solo devuelve el
        estado actual sin modificar `confirmadoEn`.
      responses:
        '200':
          description: Cliente confirmado (o ya lo estaba).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cliente' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /v1/clientes/{clienteId}:
    parameters:
      - $ref: '#/components/parameters/ClienteId'
    get:
      operationId: obtenerCliente
      tags: [Clientes]
      summary: Consulta un cliente por id
      responses:
        '200':
          description: Cliente encontrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cliente' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /v1/clientes/{clienteId}/consentimientos:
    parameters:
      - $ref: '#/components/parameters/ClienteId'
    get:
      operationId: listarConsentimientos
      tags: [Consentimientos]
      summary: Lista los consentimientos del cliente
      responses:
        '200':
          description: Consentimientos del cliente (uno por scope registrado).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Consentimiento' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    post:
      operationId: otorgarConsentimiento
      tags: [Consentimientos]
      summary: Otorga o renueva un consentimiento
      description: |
        Registra el otorgamiento de un consentimiento para un scope. Si ya existía
        `OTORGADO`, incrementa `version` y actualiza la marca temporal.

        Publica el evento `ConsentimientoOtorgado`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtorgarConsentimientoRequest' }
      responses:
        '201':
          description: Consentimiento otorgado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Consentimiento' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /v1/clientes/{clienteId}/consentimientos/{scope}:
    parameters:
      - $ref: '#/components/parameters/ClienteId'
      - $ref: '#/components/parameters/Scope'
    get:
      operationId: obtenerConsentimiento
      tags: [Consentimientos]
      summary: Consulta un consentimiento por scope
      responses:
        '200':
          description: Consentimiento.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Consentimiento' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    delete:
      operationId: revocarConsentimiento
      tags: [Consentimientos]
      summary: Revoca un consentimiento
      description: |
        Marca el consentimiento como `REVOCADO` y publica `ConsentimientoRevocado`.

        La propagación a los consumidores (p. ej. expiración de caché en Perfilamiento)
        es asíncrona y debe completarse en ≤ 5 min (NFR de revocación).
      responses:
        '204':
          description: Consentimiento revocado.
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /v1/clientes/{clienteId}/consentimientos/{scope}/estado:
    parameters:
      - $ref: '#/components/parameters/ClienteId'
      - $ref: '#/components/parameters/Scope'
    get:
      operationId: obtenerEstadoConsentimiento
      tags: [Consentimientos]
      summary: Estado efectivo de un consentimiento (consulta rápida)
      description: |
        Respuesta reducida que consume **Perfilamiento** antes de perfilar.
        Optimizada para latencia: solo estado efectivo, versión y vigencia.
      responses:
        '200':
          description: Estado del consentimiento.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EstadoConsentimiento' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /v1/clientes/{clienteId}/evidencias-identidad:
    parameters:
      - $ref: '#/components/parameters/ClienteId'
    post:
      operationId: subirEvidenciaIdentidad
      tags: [Evidencias de identidad]
      summary: Sube una foto de identidad y devuelve el veredicto
      description: |
        Una imagen por request: `tipo` dice qué se sube y `imagen` es el archivo, ya
        comprimido por el cliente (JPEG o PNG, máximo 3 MB).

        El servidor decide si la foto sirve:

        - **`ACEPTADA`** (201): se guarda como evidencia vigente del tipo y reemplaza la
          anterior no consumida. En el reverso de la cédula de ciudadanía (`CC`), solo se
          acepta si el código del reverso contiene el número con el que el cliente se registró.
        - **`REINTENTAR`** (200): no se guarda nada. `motivo` dice qué corregir.
        - **`REVISION_MANUAL`** (201): se guarda y una persona la revisa. Ocurre si no se pudo
          leer el código del reverso o su número no coincide, si el documento no es `CC`, si el
          verificador tardó demasiado o falló, y al **tercer** rechazo de un mismo tipo
          (la foto de ese tercer intento sí se guarda).

        El número leído de la imagen no sale de este servicio. `intentosRestantes` cuenta los
        rechazos que quedan antes de pasar a revisión manual; se reinicia al guardar una evidencia.

        Las fotos rechazadas no se guardan. Las aceptadas se conservan mientras viva la póliza
        que las referencie; una evidencia consumida por una póliza no se reutiliza en otra.

        **Selfie (`tipo = selfie`).** Se compara con el frente de la cédula ya guardado, así que
        ambas caras deben estar vigentes (`ACEPTADA` o `REVISION_MANUAL`); si no, responde **422**
        y no cuenta como intento. El servidor revisa la calidad, que haya un solo rostro, que sea
        una persona real (prueba de vida pasiva) y que coincida con el de la cédula. Cada puntaje
        tiene dos umbrales: bajo el inferior se rechaza (`SIN_ROSTRO`, `VARIOS_ROSTROS`,
        `POSIBLE_SUPLANTACION`, `NO_COINCIDE_CON_CEDULA`, además de `BORROSA` y `OSCURA`), sobre el
        superior se acepta y en medio decide una persona (`REVISION_MANUAL`). Si no se halla un
        rostro en la cédula, o la verificación tarda o falla, también va a `REVISION_MANUAL`.
        Los puntajes se guardan para quien revise, pero no salen en la respuesta.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/SubirEvidenciaRequest' }
      responses:
        '200':
          description: La foto no sirve (`estado = REINTENTAR`). No se creó ninguna evidencia.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenciaSubida' }
        '201':
          description: Evidencia guardada (`ACEPTADA` o `REVISION_MANUAL`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenciaSubida' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '413':
          description: La imagen supera el máximo permitido.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '422':
          description: Se subió la selfie sin que ambas caras de la cédula estén vigentes.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
    get:
      operationId: obtenerEstadoEvidenciasIdentidad
      tags: [Evidencias de identidad]
      summary: Estado vigente de cada tipo de evidencia
      description: |
        Siempre devuelve los tres tipos. `PENDIENTE` significa que no hay evidencia vigente
        (nunca se subió, o la consumió una póliza). Sirve para retomar el flujo y para habilitar
        el paso a la firma: ambas caras de la cédula en `ACEPTADA` o `REVISION_MANUAL`.
      responses:
        '200':
          description: Estado por tipo.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EstadoTipoEvidencia' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /v1/clientes/{clienteId}/polizas:
    parameters:
    - $ref: '#/components/parameters/ClienteId'
    post:
      operationId: solicitarPoliza
      tags:
      - Pólizas
      summary: Solicita la póliza de la cotización activa de un cliente
      description: Misma semántica y mismas respuestas que `POST /v1/cuenta/polizas`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitarPolizaRequest'
      responses:
        '200':
          description: Ya existía.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Poliza'
        '201':
          description: Creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Poliza'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/ConflictoPoliza'
        '422':
          $ref: '#/components/responses/FueraDeRango'
        '503':
          $ref: '#/components/responses/NoDisponible'
      security:
      - serviceAuth: []
    get:
      operationId: listarPolizasDeCliente
      tags:
      - Pólizas
      summary: Lista las pólizas de un cliente
      parameters:
      - $ref: '#/components/parameters/EstadoPolizaFiltro'
      responses:
        '200':
          description: Pólizas del cliente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Poliza'
        '404':
          $ref: '#/components/responses/NoEncontrado'
      security:
      - serviceAuth: []
  /v1/clientes/{clienteId}/polizas/{polizaId}:
    parameters:
    - $ref: '#/components/parameters/ClienteId'
    - $ref: '#/components/parameters/PolizaId'
    get:
      operationId: obtenerPolizaDeCliente
      tags:
      - Pólizas
      summary: Consulta una póliza de un cliente (re-evalúa si está pendiente)
      responses:
        '200':
          description: La póliza.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Poliza'
        '404':
          $ref: '#/components/responses/NoEncontrado'
      security:
      - serviceAuth: []
  /v1/clientes/{clienteId}/polizas/{polizaId}/documento:
    parameters:
    - $ref: '#/components/parameters/ClienteId'
    - $ref: '#/components/parameters/PolizaId'
    get:
      operationId: obtenerDocumentoPolizaDeCliente
      tags:
      - Pólizas
      summary: Documento de una póliza emitida
      description: Misma semántica y respuestas que `GET /v1/cuenta/polizas/{polizaId}/documento`.
      responses:
        '200':
          description: Listo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentoPoliza'
        '202':
          description: Generándose.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentoPoliza'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: No está emitida.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaPoliza'
        '503':
          $ref: '#/components/responses/NoDisponible'
      security:
      - serviceAuth: []
  /v1/polizas:
    get:
      operationId: listarPolizas
      tags:
      - Pólizas (backoffice)
      summary: Lista pólizas de todos los clientes, filtradas por estado
      description: 'Cola de trabajo del agente. Orden por `creadaEn`; por defecto de la **más antigua**
        a la

        más reciente, para atender primero lo que lleva más esperando.


        `estado = VENCIDA` es derivado: pólizas `PENDIENTE` con `solicitudVigenteHasta` ya pasada.

        Para ver solo lo que espera a una persona: `estado=PENDIENTE&tipoPendiente=AGENTE`.

        '
      parameters:
      - name: estado
        in: query
        schema:
          $ref: '#/components/schemas/EstadoPoliza'
      - name: tipoPendiente
        in: query
        description: Solo pólizas con al menos un pendiente de este tipo.
        schema:
          $ref: '#/components/schemas/TipoPendiente'
      - name: codigoPendiente
        in: query
        schema:
          $ref: '#/components/schemas/CodigoPendiente'
      - name: clienteId
        in: query
        schema:
          type: string
          format: uuid
      - name: creadaDesde
        in: query
        schema:
          type: string
          format: date-time
      - name: creadaHasta
        in: query
        schema:
          type: string
          format: date-time
      - name: orden
        in: query
        schema:
          type: string
          enum:
          - creadaEn
          - -creadaEn
          default: creadaEn
      - name: limite
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - name: cursor
        in: query
        description: Valor `siguienteCursor` de la página anterior.
        schema:
          type: string
          maxLength: 256
      responses:
        '200':
          description: Una página de pólizas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaPolizas'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
      security:
      - serviceAuth: []
    post:
      operationId: venderPoliza
      tags: [Venta directa]
      summary: Emite la póliza que un socio vende a un cliente (BITS-378)
      description: |
        **Interno**. Emite al instante, sin solicitud ni pendientes: el socio verificó al cliente
        cara a cara y el banco ya aprobó el crédito. El precio se calcula de nuevo con la tarifa
        del momento (el mismo cálculo de `POST /v1/polizas/precio`) y la póliza queda a nombre del
        cliente con `socioId` y `datosVenta`. Acepta las condiciones de la póliza en la versión
        vigente en Productos. **No consume las evidencias de identidad del cliente**.

        Publica `PolizaEmitida`: el documento, su correo con el PDF y el aviso push salen por el
        flujo de siempre. No manda ningún otro correo (la bienvenida es del alta del cliente). Con
        `Idempotency-Key`, un reintento del mismo socio devuelve la respuesta original `201`.

        `400` si falta `VIDA` o algún dato, `403 CLIENTE_NO_ACTIVO`, `404` si no existe el
        cliente, `422 FUERA_DE_RANGO`, `503` si Cotización o Productos no responden (no se emite
        nada).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VenderPolizaRequest' }
      responses:
        '201':
          description: Póliza emitida.
          headers:
            Location:
              description: URI de la póliza emitida.
              schema: { type: string, format: uri-reference }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolizaInterna' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/ConflictoPoliza' }
        '422': { $ref: '#/components/responses/FueraDeRango' }
        '503': { $ref: '#/components/responses/NoDisponible' }
      security:
        - serviceAuth: []
  /v1/polizas/precio:
    post:
      operationId: calcularPrecioDePoliza
      tags: [Venta directa]
      summary: Precio del seguro para un cliente, sin guardar nada (BITS-378)
      description: |
        **Interno**. Calcula lo que costaría asegurar un crédito nuevo con las mismas reglas y la
        misma tarifa que la cotización del autoservicio, con Vida y Hogar. **No crea cotización
        ni solicitud** y no publica `CotizacionCreada`, así que no toca la solicitud pendiente
        que el cliente tenga por su cuenta. El crédito es nuevo: el saldo es el valor. La edad
        sale de la fecha de nacimiento del cliente.

        `422 FUERA_DE_RANGO` si el cliente no tiene entre 18 y 65 años o el crédito termina
        después de los 75. `403 CLIENTE_NO_ACTIVO` si el cliente no está `ACTIVO`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrecioPolizaRequest' }
      responses:
        '200':
          description: El precio calculado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrecioPoliza' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/FueraDeRango' }
        '503': { $ref: '#/components/responses/NoDisponible' }
      security:
        - serviceAuth: []

  /v1/polizas/{polizaId}:
    parameters:
    - $ref: '#/components/parameters/PolizaId'
    get:
      operationId: obtenerPolizaInterna
      tags:
      - Pólizas (backoffice)
      summary: Detalle de una póliza para quien la revisa
      description: 'Incluye lo que el cliente no ve: evidencias referenciadas, aprobaciones ya registradas
        y los

        datos de la cotización usada. No re-evalúa: muestra el último estado calculado.

        '
      responses:
        '200':
          description: Detalle interno.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolizaInterna'
        '404':
          $ref: '#/components/responses/NoEncontrado'
      security:
      - serviceAuth: []
  /v1/polizas/{polizaId}/decisiones:
    parameters:
    - $ref: '#/components/parameters/PolizaId'
    post:
      operationId: decidirPoliza
      tags:
      - Pólizas (backoffice)
      summary: Aprueba pendientes o rechaza una póliza
      description: "El personal de Solventa toma una decisión sobre una póliza `PENDIENTE`:\n\n- **`APROBAR`**:\
        \ registra que verificó los `pendientes` indicados (solo de tipo `AGENTE`:\n  `EVIDENCIA_EN_REVISION`\
        \ y/o `CREDITO_NO_VERIFICADO`) y **re-evalúa**. Si ya no queda\n  ningún pendiente (tampoco de usuario),\
        \ la póliza pasa a `EMITIDA` en la misma operación;\n  si no, sigue `PENDIENTE` con lo que falta.\
        \ Repetir una aprobación ya registrada no cambia\n  nada.\n- **`RECHAZAR`**: la póliza pasa a `RECHAZADA`\
        \ (terminal). `pendientes` indica el\n  escenario que motiva el rechazo, y de él sale el mensaje\
        \ que ve el cliente (no hay texto\n  libre). Se puede rechazar aunque queden pendientes de usuario.\
        \ Las evidencias no se\n  consumen.\n\nMensajes al cliente por escenario:\n\n- `CREDITO_NO_VERIFICADO`:\
        \ «No pudimos verificar los datos de tu crédito con la entidad\n  acreedora.»\n- `EVIDENCIA_EN_REVISION`:\
        \ «No pudimos validar tu identidad con los documentos que\n  enviaste.»\n\nCada decisión queda registrada\
        \ con quién, cuándo y la nota interna.\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
            examples:
              aprobar:
                value:
                  decision: APROBAR
                  agente: maria.gomez@solventa.co
                  pendientes:
                  - CREDITO_NO_VERIFICADO
                  nota: Saldo y plazo confirmados con el certificado del banco.
              rechazar:
                value:
                  decision: RECHAZAR
                  agente: maria.gomez@solventa.co
                  pendientes:
                  - CREDITO_NO_VERIFICADO
                  nota: El banco no reconoce el número de crédito.
      responses:
        '200':
          description: Decisión registrada; póliza re-evaluada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolizaInterna'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: La póliza no está `PENDIENTE` (`codigo = POLIZA_NO_PENDIENTE`) o ya venció (`SOLICITUD_VENCIDA`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaPoliza'
        '422':
          description: 'Un pendiente indicado no aplica: la póliza no lo tiene (`codigo = PENDIENTE_NO_APLICA`).

            '
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaPoliza'
      security:
      - serviceAuth: []

  /v1/clientes/{clienteId}/dispositivos:
    parameters:
      - $ref: '#/components/parameters/ClienteId'
    put:
      operationId: registrarDispositivo
      tags: [Dispositivos]
      summary: Registra o actualiza el dispositivo del cliente para avisos push
      description: |
        La app obtiene su token de Firebase y lo registra aquí a través del BFF móvil (BITS-229).

        Idempotente: repetir el mismo token solo renueva su última vista. Si el token ya era de
        otro cliente (teléfono compartido), pasa a este. Cada cliente conserva como máximo 5
        dispositivos; al registrar uno más se descarta el que lleva más tiempo sin verse.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistrarDispositivoRequest' }
      responses:
        '200':
          description: Dispositivo registrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dispositivo' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /v1/clientes/{clienteId}/dispositivos/{dispositivoId}:
    parameters:
      - $ref: '#/components/parameters/ClienteId'
      - name: dispositivoId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: quitarDispositivo
      tags: [Dispositivos]
      summary: Quita el dispositivo del cliente
      description: |
        Idempotente: si el dispositivo ya no existe, o es de otro cliente, responde igual `204`.
        La app lo pide al cerrar sesión y no debe depender de lo ocurrido antes.
      responses:
        '204':
          description: El dispositivo ya no está registrado para el cliente.

  /v1/usuarios-internos:
    post:
      operationId: crearUsuarioInterno
      tags: [Usuarios internos]
      summary: Crea una cuenta del personal de Solventa (administrador o socio)
      description: |
        Interno y sin gateway: solo lo llama bff-web, desde la ruta que exige el rol `ADMIN`.

        Crea la cuenta en Identity Platform con el correo ya verificado, el rol en
        `customAttributes` y el nombre en `displayName`. El `uid` de una cuenta `SOCIO` es su
        `socioId`. El correo debe ser `@solventa4bits.com`, sin distinguir mayúsculas, y se guarda
        en minúsculas. `nombre` es obligatorio para `SOCIO` y puede repetirse entre cuentas.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CrearUsuarioInternoRequest' }
      responses:
        '201':
          description: Cuenta creada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsuarioInterno' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '409':
          description: Ya existe una cuenta con ese correo (`errores[].campo = correo`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '503':
          description: Identity Platform no responde (`codigo = IDENTIDAD_NO_DISPONIBLE`). Reintentar.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaPoliza' }

  /v1/clientes/{clienteId}/siniestros:
    parameters:
      - $ref: '#/components/parameters/ClienteId'
    post:
      operationId: reportarSiniestro
      tags: [Siniestros]
      summary: Reporta un siniestro con su evidencia
      description: |
        Lo llama el BFF móvil con el `clienteId` de la sesión. Es `multipart/form-data`: la parte
        `datos` (JSON) lleva la póliza, el tipo, la fecha, la narración, el destino del pago y,
        por cada archivo, su clase y su ubicación; las partes `archivos` son las imágenes, en el
        mismo orden. La ubicación viaja en `datos` y no en la foto, porque la app borra los
        metadatos al recomprimirla.

        El siniestro nace `EN_ESTUDIO` con su `numero` (el radicado). Se guarda, una sola vez, el
        saldo del crédito: el de Open Finance (svc-perfilamiento) y, si no responde o no hay
        consentimiento, el de la póliza. Los archivos van al bucket de evidencias con el prefijo
        `siniestros/`.

        Idempotente con `Idempotency-Key`: repetir el reporte devuelve el mismo siniestro. Una
        póliza no puede tener dos siniestros de la misma cobertura en curso: Vida para
        `INCAPACIDAD_TOTAL`, Tu casa para `INCENDIO_TERREMOTO`.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, maxLength: 64 }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [datos, archivos]
              properties:
                datos: { $ref: '#/components/schemas/ReportarSiniestroDatos' }
                archivos:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items: { type: string, format: binary }
            encoding:
              datos: { contentType: application/json }
              archivos: { contentType: 'image/jpeg, image/png' }
      responses:
        '201':
          description: Siniestro radicado, `EN_ESTUDIO`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiniestroReportado' }
        '400':
          description: |
            Reporte inválido (`errores[].campo`) o `TIPO_NO_CUBIERTO`: es `INCENDIO_TERREMOTO` y la
            póliza no tiene la cobertura `HOGAR`. Falta la narración, el destino del pago o la
            evidencia, el destino llega en `INCAPACIDAD_TOTAL`, o una imagen no sirve.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaSiniestro' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: |
            `FUERA_DE_VIGENCIA`: la fecha es futura, anterior a `emitida_en` o posterior a
            `vigencia.hasta`, o la póliza no está `EMITIDA` ni `DESACTIVADA`. `SINIESTRO_EN_CURSO`:
            la póliza ya tiene un siniestro de esa cobertura `EN_ESTUDIO` o `FALTA_INFORMACION`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaSiniestro' }
        '413':
          description: Una imagen supera el tamaño máximo.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
    get:
      operationId: listarSiniestrosDelCliente
      tags: [Siniestros]
      summary: Lista los siniestros del cliente
      description: |
        Del más reciente al más antiguo, sin paginar. Incluye los de pago automático por sismo
        (`automatico: true`). El detalle de cada uno está en `/siniestros/{siniestroId}`.
      responses:
        '200':
          description: Siniestros del cliente (vacía si no tiene).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SiniestroResumen' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /v1/clientes/{clienteId}/siniestros/{siniestroId}:
    parameters:
      - $ref: '#/components/parameters/ClienteId'
      - $ref: '#/components/parameters/SiniestroId'
    get:
      operationId: obtenerSiniestroDelCliente
      tags: [Siniestros]
      summary: Detalle de un siniestro del cliente
      description: |
        Estado, plazo y lo que el cliente necesita saber: lo que Solventa pidió
        (`evidenciaPedida`), el motivo del rechazo, la orden de pago y los archivos con la fecha de
        cada entrega. En el paramétrico trae también `automatico` y `evento`.

        `fechaLimite` (la última entrega más un mes, art. 1080) solo existe en `EN_ESTUDIO`: en
        `FALTA_INFORMACION` el reloj se detiene. **No devuelve el saldo del crédito ni el destino
        del pago**: ahí está el número de cuenta.

        Un siniestro de otro cliente responde `404`, igual que uno que no existe.
      responses:
        '200':
          description: El siniestro.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Siniestro' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /v1/clientes/{clienteId}/siniestros/{siniestroId}/evidencias:
    parameters:
      - $ref: '#/components/parameters/ClienteId'
      - $ref: '#/components/parameters/SiniestroId'
    post:
      operationId: entregarEvidenciasDelSiniestro
      tags: [Siniestros]
      summary: Envía lo que Solventa pidió
      description: |
        Solo con el siniestro en `FALTA_INFORMACION`. Es `multipart/form-data`, igual que el
        reporte: la parte `datos` (JSON) lleva, por cada archivo, su clase y su ubicación, y las
        partes `archivos` son las imágenes, en el mismo orden.

        El siniestro vuelve a `EN_ESTUDIO`, el plazo corre de nuevo desde esta entrega y cada
        archivo queda con su fecha (`entregadoEn`). No envía push: la bandeja es el aviso del
        `ADMIN`. Responde el detalle actualizado.

        Idempotente con `Idempotency-Key`.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, maxLength: 64 }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [datos, archivos]
              properties:
                datos: { $ref: '#/components/schemas/EntregarEvidenciasDatos' }
                archivos:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items: { type: string, format: binary }
            encoding:
              datos: { contentType: application/json }
              archivos: { contentType: 'image/jpeg, image/png' }
      responses:
        '201':
          description: Evidencia recibida; el siniestro volvió a `EN_ESTUDIO`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Siniestro' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: |
            `ESTADO_NO_PERMITE`: el siniestro no está en `FALTA_INFORMACION` (no se pidió nada, o
            otra entrega llegó primero).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaSiniestro' }
        '413':
          description: Una imagen supera el tamaño máximo.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  /v1/siniestros:
    get:
      operationId: listarBandejaDeSiniestros
      tags: [Siniestros (backoffice)]
      summary: Bandeja de siniestros de todos los clientes
      description: |
        Interno y sin gateway: solo lo llama bff-web, desde la ruta que exige el rol `ADMIN`.

        Sin filtros trae todos. `estado=EN_ESTUDIO` es la bandeja de trabajo (los recién reportados y
        los que volvieron porque el cliente envió lo que faltaba); `automatico=true`, los pagos por
        sismo, en solo lectura. Va ordenada por plazo: primero los que corren (`EN_ESTUDIO`), del que
        vence antes al que vence después, y luego los demás, del más reciente al más antiguo.
      parameters:
        - name: estado
          in: query
          required: false
          schema: { $ref: '#/components/schemas/EstadoSiniestro' }
        - name: automatico
          in: query
          required: false
          schema: { type: boolean }
      responses:
        '200':
          description: Los siniestros que cumplen los filtros (vacía si no hay).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SiniestroInternoResumen' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }

  /v1/siniestros/{siniestroId}:
    parameters:
      - $ref: '#/components/parameters/SiniestroId'
    get:
      operationId: obtenerSiniestroInterno
      tags: [Siniestros (backoffice)]
      summary: Detalle de un siniestro para el ADMIN
      description: |
        El detalle del cliente más lo que solo el `ADMIN` ve: el cliente, la póliza con la cobertura
        afectada y su suma asegurada, el saldo del crédito guardado al reportar con su origen y su
        fecha, cómo recibe el pago el cliente y las decisiones con quién las tomó.
      responses:
        '200':
          description: El siniestro.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiniestroInterno' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /v1/siniestros/{siniestroId}/evidencias/{evidenciaId}:
    parameters:
      - $ref: '#/components/parameters/SiniestroId'
      - name: evidenciaId
        in: path
        required: true
        description: El `id` de un archivo del siniestro (`archivos[].id` del detalle).
        schema: { type: string, format: uuid }
    get:
      operationId: obtenerArchivoDelSiniestro
      tags: [Siniestros (backoffice)]
      summary: Devuelve un archivo del siniestro
      description: |
        La imagen tal como se guardó, para abrirla en la bandeja sin descargarla
        (`Content-Disposition: inline`). Sin caché.
      responses:
        '200':
          description: El archivo.
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /v1/siniestros/{siniestroId}/decisiones:
    parameters:
      - $ref: '#/components/parameters/SiniestroId'
    post:
      operationId: decidirSiniestro
      tags: [Siniestros (backoffice)]
      summary: Paga, pide más evidencia o rechaza un siniestro
      description: |
        `PAGAR`, `PEDIR_EVIDENCIA` o `RECHAZAR`, siempre con el `agente` (el usuario de la sesión, que
        llena el BFF). Cada decisión guarda quién la tomó, cuándo, cuál fue y el valor o el motivo. No
        hay nota interna. Una decisión con un campo que no le corresponde es `400`.

        | Decisión | Campos | Resultado |
        |---|---|---|
        | `PAGAR`, incapacidad total | ninguno más | Una línea `BANCO` por el saldo guardado |
        | `PAGAR`, Tu casa reparable | `dano: REPARABLE`, `valor` | Una línea `CLIENTE` al destino que eligió |
        | `PAGAR`, Tu casa pérdida total | `dano: PERDIDA_TOTAL`, `valor` | `BANCO` hasta el saldo guardado y `CLIENTE` por el resto; si el valor no supera el saldo, solo `BANCO` |
        | `PEDIR_EVIDENCIA` | `detalle` | `FALTA_INFORMACION`, con `evidenciaPedida` |
        | `RECHAZAR` | `motivo` | `RECHAZADO`, con el motivo que ve el cliente |

        El `valor` de Tu casa no puede superar la suma asegurada de `HOGAR` (`422`). Pagar, pedir o
        rechazar avisa por push al cliente.

        **Una sola orden de pago por siniestro.** La llave es el siniestro: pagar un siniestro ya
        `PAGADO`, al mismo tiempo o después, no crea otra orden y devuelve la que existe. Un siniestro
        ya `PAGADO` o `RECHAZADO` no cambia con ninguna decisión: se devuelve como quedó. Uno en
        `FALTA_INFORMACION` ya salió de la bandeja y responde `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecidirSiniestroRequest' }
      responses:
        '200':
          description: El siniestro después de la decisión (o como ya estaba).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiniestroInterno' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: El siniestro está en `FALTA_INFORMACION` (`codigo = ESTADO_NO_PERMITE`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaSiniestro' }
        '422':
          description: El `valor` supera la suma asegurada (`codigo = VALOR_SUPERA_SUMA_ASEGURADA`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaSiniestro' }

components:

  securitySchemes:
    serviceAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token de identidad de servicio emitido por la malla / gateway interno.
        No se aceptan tokens de cliente final directamente contra esta API.

  parameters:
    ClienteId:
      name: clienteId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Scope:
      name: scope
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ConsentimientoScope' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Clave de idempotencia para reintentos seguros del alta.
      schema: { type: string, maxLength: 64 }

    PolizaId:
      name: polizaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SiniestroId:
      name: siniestroId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EstadoPolizaFiltro:
      name: estado
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/EstadoPoliza'

  responses:
    SolicitudInvalida:
      description: Solicitud mal formada o con validación de esquema fallida.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    NoEncontrado:
      description: El recurso no existe.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    Conflicto:
      description: Ya existe un cliente para ese documento o ese correo (ver `errores[].campo`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    EntidadNoProcesable:
      description: La solicitud es válida pero incumple una regla de negocio.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }

    ConflictoPoliza:
      description: '`SIN_COTIZACION` (el cliente no tiene cotización activa), `COTIZACION_VENCIDA`,

        `COTIZACION_CAMBIO` (la activa no es la que el cliente vio: volver a mostrarla),

        `SOLICITUD_EXISTENTE` (ya hay una solicitud de esa cotización con otras coberturas) o

        `SOLICITUD_RECHAZADA` (esa solicitud fue rechazada por un agente).

        '
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemaPoliza'
    NoDisponible:
      description: Cotización no disponible (`codigo = COTIZACION_NO_DISPONIBLE`). Reintentar; no se emite
        nada.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemaPoliza'
    Prohibido:
      description: El cliente no está `ACTIVO` (`codigo = CLIENTE_NO_ACTIVO`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemaPoliza'
    FueraDeRango:
      description: Edad o plazo fuera de rango (`codigo = FUERA_DE_RANGO`). No se crea la solicitud.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemaPoliza'

  schemas:

    RegistrarClienteRequest:
      type: object
      additionalProperties: false
      required: [identityRef, tipoDocumento, numeroDocumento, primerNombre, primerApellido, fechaNacimiento, email, telefono, canal, autorizaTratamientoDatos, autorizaDatosFinancieros]
      properties:
        identityRef:
          type: string
          maxLength: 128
          description: Identificador de la identidad de autenticación (`sub` de Identity Platform).
        tipoDocumento: { $ref: '#/components/schemas/TipoDocumento' }
        numeroDocumento:
          type: string
          minLength: 4
          maxLength: 20
          pattern: '^[0-9A-Za-z-]+$'
        primerNombre: { type: string, minLength: 1, maxLength: 60 }
        segundoNombre:
          type: [string, 'null']
          maxLength: 60
        primerApellido: { type: string, minLength: 1, maxLength: 60 }
        segundoApellido:
          type: [string, 'null']
          maxLength: 60
        fechaNacimiento: { type: string, format: date }
        email: { type: string, format: email, maxLength: 254 }
        telefono:
          type: string
          pattern: '^\+?[0-9]{7,15}$'
          description: Celular de contacto (obligatorio desde BITS-93).
        canal:
          $ref: '#/components/schemas/Canal'
          description: Canal desde el que se registra, para el consentimiento (igual que en otorgarConsentimiento).
        autorizaTratamientoDatos:
          type: boolean
          description: |
            Consentimiento OPEN_DATA (tratamiento de datos personales) otorgado en el
            propio registro (BITS-93). `false` no bloquea el registro; solo deja el
            consentimiento en `NO_OTORGADO`.
        politicaVersionTratamientoDatos:
          type: [string, 'null']
          maxLength: 20
          description: Versión del aviso de tratamiento de datos aceptado. Solo aplica si se autoriza.
        autorizaDatosFinancieros:
          type: boolean
          description: |
            Consentimiento OPEN_FINANCE otorgado en el propio registro (BITS-93 AC-9).
            `false` no bloquea el registro; solo deja el consentimiento en `NO_OTORGADO`.
        politicaVersionDatosFinancieros:
          type: [string, 'null']
          maxLength: 20
          description: Versión de la autorización de datos financieros aceptada. Solo aplica si se autoriza.

    Cliente:
      type: object
      additionalProperties: false
      required: [id, identityRef, tipoDocumento, numeroDocumento, primerNombre, primerApellido, fechaNacimiento, email, telefono, estado, correoConfirmado, creadoEn]
      properties:
        id: { type: string, format: uuid }
        identityRef: { type: string }
        tipoDocumento: { $ref: '#/components/schemas/TipoDocumento' }
        numeroDocumento: { type: string }
        primerNombre: { type: string }
        segundoNombre: { type: [string, 'null'] }
        primerApellido: { type: string }
        segundoApellido: { type: [string, 'null'] }
        fechaNacimiento: { type: string, format: date }
        email: { type: string, format: email }
        telefono: { type: string }
        estado: { $ref: '#/components/schemas/EstadoCliente' }
        correoConfirmado:
          type: boolean
          description: BITS-93 AC-3 — no condiciona cotización ni coberturas, solo la formalización del contrato.
        confirmadoEn: { type: [string, 'null'], format: date-time }
        creadoEn: { type: string, format: date-time }
        actualizadoEn: { type: [string, 'null'], format: date-time }

    Disponibilidad:
      type: object
      additionalProperties: false
      properties:
        correoDisponible: { type: [boolean, 'null'], description: 'null si no se consultó correo.' }
        documentoDisponible: { type: [boolean, 'null'], description: 'null si no se consultó documento.' }

    OtorgarConsentimientoRequest:
      type: object
      additionalProperties: false
      required: [scope, politicaVersion, canal]
      properties:
        scope: { $ref: '#/components/schemas/ConsentimientoScope' }
        politicaVersion:
          type: string
          maxLength: 20
          description: Versión del texto de política/consentimiento aceptado por el cliente.
        canal: { $ref: '#/components/schemas/Canal' }

    Consentimiento:
      type: object
      additionalProperties: false
      required: [scope, estado, version, actualizadoEn]
      properties:
        scope: { $ref: '#/components/schemas/ConsentimientoScope' }
        estado: { $ref: '#/components/schemas/EstadoConsentimientoEnum' }
        version: { type: integer, minimum: 1 }
        politicaVersion: { type: [string, 'null'] }
        canal: { $ref: '#/components/schemas/Canal' }
        otorgadoEn: { type: [string, 'null'], format: date-time }
        revocadoEn: { type: [string, 'null'], format: date-time }
        actualizadoEn: { type: string, format: date-time }

    EstadoConsentimiento:
      type: object
      additionalProperties: false
      required: [scope, estado, version, vigente]
      properties:
        scope: { $ref: '#/components/schemas/ConsentimientoScope' }
        estado: { $ref: '#/components/schemas/EstadoConsentimientoEnum' }
        version: { type: integer, minimum: 1 }
        vigente:
          type: boolean
          description: true si el estado efectivo habilita el acceso a datos de ese scope.

    TipoDocumento:
      type: string
      enum: [CC, CE, PA, NIT]
    EstadoCliente:
      type: string
      enum: [ACTIVO, BLOQUEADO, INACTIVO]
    ConsentimientoScope:
      type: string
      enum: [OPEN_FINANCE, OPEN_DATA]
    EstadoConsentimientoEnum:
      type: string
      enum: [OTORGADO, REVOCADO, NO_OTORGADO]
    Canal:
      type: string
      enum: [WEB, MOVIL, BACKOFFICE]

    TipoEvidencia:
      type: string
      enum: [cedula_frente, cedula_reverso, selfie]
    EstadoEvidencia:
      type: string
      enum: [ACEPTADA, REINTENTAR, REVISION_MANUAL]
    MotivoRechazo:
      type: string
      enum:
        - BORROSA
        - OSCURA
        - REFLEJO
        - RECORTADA
        - NO_ES_CEDULA
        - SIN_ROSTRO
        - VARIOS_ROSTROS
        - POSIBLE_SUPLANTACION
        - NO_COINCIDE_CON_CEDULA
      description: |
        `REFLEJO` incluye la sobreexposición global. `BORROSA` incluye la foto con muy pocos
        píxeles. `NO_ES_CEDULA` es que no se halló un rectángulo con la proporción de una tarjeta.

        Los cuatro últimos son de la selfie. `SIN_ROSTRO` incluye un rostro demasiado pequeño;
        `VARIOS_ROSTROS` es más de una persona en la foto; `POSIBLE_SUPLANTACION` es que la prueba
        de vida pasiva no cree que sea una persona real (foto de una foto o de una pantalla);
        `NO_COINCIDE_CON_CEDULA` es que el rostro no se parece al de la cédula.
        Los clientes deben tolerar motivos que no conozcan.

    SubirEvidenciaRequest:
      type: object
      required: [tipo, imagen]
      properties:
        tipo: { $ref: '#/components/schemas/TipoEvidencia' }
        imagen: { type: string, format: binary, description: Foto en JPEG o PNG, máximo 3 MB. }

    EvidenciaSubida:
      type: object
      additionalProperties: false
      required: [tipo, estado, intentosRestantes]
      properties:
        evidenciaId:
          type: [string, 'null']
          format: uuid
          description: "`null` con `REINTENTAR`: no se guardó nada."
        tipo: { $ref: '#/components/schemas/TipoEvidencia' }
        estado: { $ref: '#/components/schemas/EstadoEvidencia' }
        motivo:
          oneOf:
            - { $ref: '#/components/schemas/MotivoRechazo' }
            - { type: 'null' }
          description: Solo con `REINTENTAR`.
        intentosRestantes: { type: integer, minimum: 0 }

    EstadoTipoEvidencia:
      type: object
      additionalProperties: false
      required: [tipo, estado, intentosRestantes]
      properties:
        tipo: { $ref: '#/components/schemas/TipoEvidencia' }
        estado: { type: string, enum: [ACEPTADA, REVISION_MANUAL, PENDIENTE] }
        evidenciaId: { type: [string, 'null'], format: uuid }
        creadaEn: { type: [string, 'null'], format: date-time }
        intentosRestantes: { type: integer, minimum: 0 }

    Problema:
      description: Error en formato RFC 9457 (Problem Details for HTTP APIs).
      type: object
      properties:
        type: { type: string, format: uri, default: 'about:blank' }
        title: { type: string }
        status: { type: integer, minimum: 100, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        errores:
          type: array
          description: Detalle por campo cuando aplica (validación).
          items:
            type: object
            properties:
              campo: { type: string }
              mensaje: { type: string }

    ProblemaPoliza:
      allOf:
      - $ref: '#/components/schemas/Problema'
      - type: object
        properties:
          codigo:
            type: string
            enum:
            - CLIENTE_NO_ACTIVO
            - SIN_COTIZACION
            - COTIZACION_VENCIDA
            - COTIZACION_CAMBIO
            - COTIZACION_NO_DISPONIBLE
            - FUERA_DE_RANGO
            - SOLICITUD_EXISTENTE
            - SOLICITUD_RECHAZADA
            - POLIZA_NO_EMITIDA
            - POLIZA_NO_PENDIENTE
            - SOLICITUD_VENCIDA
            - PENDIENTE_NO_APLICA
            - DOCUMENTO_NO_DISPONIBLE
            - IDENTIDAD_NO_DISPONIBLE
    CodigoPendiente:
      type: string
      enum:
      - CORREO_SIN_CONFIRMAR
      - EVIDENCIA_FALTANTE
      - EVIDENCIA_EN_REVISION
      - CREDITO_NO_VERIFICADO
    Poliza:
      type: object
      required:
      - polizaId
      - estado
      - producto
      - creadaEn
      - coberturas
      - primaTotalMensual
      - moneda
      - datosCredito
      - origenDatos
      - cotizacionCreadaEn
      - pendientes
      - documento
      properties:
        polizaId:
          type: string
          format: uuid
        numero:
          type:
          - string
          - 'null'
          example: SOL-VH-2026-K7M2Q9
          description: Solo cuando está `EMITIDA`.
        estado:
          $ref: '#/components/schemas/EstadoPoliza'
        producto:
          type: string
          enum:
          - VIDA_HIPOTECARIO
        creadaEn:
          type: string
          format: date-time
        emitidaEn:
          type:
          - string
          - 'null'
          format: date-time
        solicitudVigenteHasta:
          type:
          - string
          - 'null'
          format: date-time
          description: 'Fin de la vigencia de la cotización atada. Una solicitud `PENDIENTE` pasa a `VENCIDA`

            después de esta fecha. `null` si está `EMITIDA`.

            '
        vigencia:
          oneOf:
          - $ref: '#/components/schemas/Vigencia'
          - type: 'null'
          description: Vigencia de la cobertura; solo cuando está `EMITIDA`.
        coberturas:
          type: array
          items:
            $ref: '#/components/schemas/CoberturaContratada'
        primaTotalMensual:
          type: number
        moneda:
          type: string
          enum:
          - COP
        datosCredito:
          $ref: '#/components/schemas/DatosCredito'
        origenDatos:
          $ref: '#/components/schemas/OrigenDatos'
        cotizacionCreadaEn:
          type: string
          format: date-time
        pendientes:
          type: array
          description: Vacía cuando está `EMITIDA`.
          items:
            $ref: '#/components/schemas/Pendiente'
        documento:
          $ref: '#/components/schemas/EstadoDocumento'
        documentosAceptados:
          type: array
          items:
            $ref: '#/components/schemas/DocumentoAceptado'
        rechazo:
          type:
          - object
          - 'null'
          additionalProperties: false
          required:
          - motivos
          - rechazadaEn
          description: Solo cuando está `RECHAZADA`.
          properties:
            motivos:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                required:
                - codigo
                - mensaje
                properties:
                  codigo:
                    $ref: '#/components/schemas/CodigoPendienteDeAgente'
                  mensaje:
                    type: string
                    description: Texto fijo del escenario
                    listo para mostrar.: null
            rechazadaEn:
              type: string
              format: date-time
    SolicitarPolizaRequest:
      type: object
      additionalProperties: false
      required:
      - coberturas
      - cotizacionCreadaEn
      - documentosAceptados
      properties:
        coberturas:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/CodigoCobertura'
          description: Debe incluir `VIDA` (obligatoria). `HOGAR` es opcional.
        cotizacionCreadaEn:
          type: string
          format: date-time
          description: '`creadaEn` de la cotización que el cliente tiene en pantalla. Si no coincide con la

            activa, responde 409 `COTIZACION_CAMBIO`: el cliente no paga un precio que no vio.

            '
        documentosAceptados:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DocumentoAceptadoEntrada'
          description: 'Documentos legales que la interfaz mostró y el cliente aceptó. Debe incluir el tipo

            `poliza`. Se guardan con fecha de aceptación. No se valida que la versión exista en

            Productos, igual que las versiones de política del registro.

            '
    CoberturaContratada:
      type: object
      additionalProperties: false
      required:
      - codigo
      - obligatoria
      - sumaAsegurada
      - primaNeta
      - iva
      - primaTotal
      properties:
        codigo:
          $ref: '#/components/schemas/CodigoCobertura'
        obligatoria:
          type: boolean
        sumaAsegurada:
          type: number
        primaNeta:
          type: number
        iva:
          type: number
        primaTotal:
          type: number
    DatosCredito:
      type: object
      additionalProperties: false
      required:
      - valorCredito
      - plazoRestanteMeses
      - entidadAcreedora
      - saldoInsoluto
      properties:
        valorCredito:
          type: number
        plazoRestanteMeses:
          type: integer
        entidadAcreedora:
          type: string
        saldoInsoluto:
          type: number
    EstadoPoliza:
      type: string
      enum:
      - PENDIENTE
      - EMITIDA
      - RECHAZADA
      - VENCIDA
      - DESACTIVADA
      description: '`VENCIDA` se deriva al leer; no se guarda. `DESACTIVADA`: rechazó la renovación y llegó el aniversario; todavía acepta siniestros de su vigencia.'
    CodigoPendienteDeAgente:
      type: string
      enum:
      - EVIDENCIA_EN_REVISION
      - CREDITO_NO_VERIFICADO
    TipoPendiente:
      type: string
      enum:
      - USUARIO
      - AGENTE
    PaginaPolizas:
      type: object
      additionalProperties: false
      required:
      - items
      - siguienteCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PolizaResumen'
        siguienteCursor:
          type:
          - string
          - 'null'
          description: '`null` en la última página.'
    Vigencia:
      type: object
      additionalProperties: false
      required:
      - desde
      - hasta
      properties:
        desde:
          type: string
          format: date-time
        hasta:
          type: string
          format: date-time
    PolizaResumen:
      type: object
      additionalProperties: false
      required:
      - polizaId
      - clienteId
      - estado
      - creadaEn
      - primaTotalMensual
      - origenDatos
      - pendientes
      properties:
        polizaId:
          type: string
          format: uuid
        numero:
          type:
          - string
          - 'null'
        clienteId:
          type: string
          format: uuid
        estado:
          $ref: '#/components/schemas/EstadoPoliza'
        creadaEn:
          type: string
          format: date-time
        solicitudVigenteHasta:
          type:
          - string
          - 'null'
          format: date-time
        primaTotalMensual:
          type: number
        origenDatos:
          $ref: '#/components/schemas/OrigenDatos'
        pendientes:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - codigo
            - tipo
            properties:
              codigo:
                $ref: '#/components/schemas/CodigoPendiente'
              tipo:
                $ref: '#/components/schemas/TipoPendiente'
    DecisionRequest:
      type: object
      additionalProperties: false
      required:
      - decision
      - agente
      - pendientes
      properties:
        decision:
          type: string
          enum:
          - APROBAR
          - RECHAZAR
        agente:
          type: string
          maxLength: 128
          description: Correo o identificador de la persona de Solventa que decide.
        pendientes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/CodigoPendienteDeAgente'
          description: 'Con `APROBAR`, los pendientes que el agente verificó. Con `RECHAZAR`, el escenario
            que

            motiva el rechazo, del que sale el mensaje al cliente.

            '
        nota:
          type: string
          maxLength: 500
          description: Interna; el cliente no la ve.
    PolizaInterna:
      unevaluatedProperties: false
      description: La póliza que ve el cliente más lo que solo ve quien la revisa.
      allOf:
      - $ref: '#/components/schemas/Poliza'
      - type: object
        required:
        - clienteId
        - evidencias
        - decisiones
        properties:
          clienteId:
            type: string
            format: uuid
          socioId:
            type:
            - string
            - 'null'
            description: Solo las pólizas que vendió un socio (BITS-378).
          datosVenta:
            oneOf:
            - $ref: '#/components/schemas/DatosVenta'
            - type: 'null'
          ultimaEvaluacionEn:
            type:
            - string
            - 'null'
            format: date-time
          tasa:
            type: number
          versionTarifa:
            type: integer
          evidencias:
            type: array
            description: Estado vigente de cada tipo de evidencia del cliente.
            items:
              type: object
              additionalProperties: false
              required:
              - tipo
              - estado
              properties:
                tipo:
                  $ref: '#/components/schemas/TipoEvidencia'
                estado:
                  type: string
                  enum:
                  - ACEPTADA
                  - REVISION_MANUAL
                  - PENDIENTE
                evidenciaId:
                  type:
                  - string
                  - 'null'
                  format: uuid
          decisiones:
            type: array
            description: Historial de decisiones del personal de Solventa, de la más antigua a la más reciente.
            items:
              type: object
              additionalProperties: false
              required:
              - decision
              - agente
              - decididaEn
              properties:
                decision:
                  type: string
                  enum:
                  - APROBAR
                  - RECHAZAR
                agente:
                  type: string
                pendientes:
                  type: array
                  items:
                    $ref: '#/components/schemas/CodigoPendienteDeAgente'
                nota:
                  type:
                  - string
                  - 'null'
                decididaEn:
                  type: string
                  format: date-time
    CrearClienteAsistidoRequest:
      type: object
      additionalProperties: false
      required: [tipoDocumento, numeroDocumento, primerNombre, primerApellido, fechaNacimiento, email, telefono]
      properties:
        tipoDocumento: { $ref: '#/components/schemas/TipoDocumento' }
        numeroDocumento:
          type: string
          minLength: 4
          maxLength: 20
          pattern: '^[0-9A-Za-z-]+$'
        primerNombre: { type: string, minLength: 1, maxLength: 60 }
        segundoNombre: { type: [string, 'null'], maxLength: 60 }
        primerApellido: { type: string, minLength: 1, maxLength: 60 }
        segundoApellido: { type: [string, 'null'], maxLength: 60 }
        fechaNacimiento: { type: string, format: date }
        email: { type: string, format: email, maxLength: 254 }
        telefono:
          type: string
          pattern: '^\+?[0-9]{7,15}$'

    PrecioPolizaRequest:
      type: object
      additionalProperties: false
      required: [clienteId, valorCredito, plazoRestanteMeses, entidadAcreedora]
      properties:
        clienteId: { type: string, minLength: 1, maxLength: 64 }
        valorCredito: { type: number, exclusiveMinimum: 0, description: El crédito es nuevo, así que el saldo es este mismo valor. }
        plazoRestanteMeses: { type: integer, minimum: 1, maximum: 480 }
        entidadAcreedora: { type: string, minLength: 1, maxLength: 80 }

    VenderPolizaRequest:
      type: object
      additionalProperties: false
      required: [clienteId, socioId, coberturas, valorCredito, plazoRestanteMeses, entidadAcreedora, cuotaMensual, direccion, municipio]
      properties:
        clienteId: { type: string, minLength: 1, maxLength: 64 }
        socioId:
          type: string
          minLength: 1
          maxLength: 128
          description: El `uid` del socio que vende (lo pone el BFF con el del token).
        coberturas:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/CodigoCobertura' }
          description: Debe incluir `VIDA`.
        valorCredito: { type: number, exclusiveMinimum: 0 }
        plazoRestanteMeses: { type: integer, minimum: 1, maximum: 480 }
        entidadAcreedora: { type: string, minLength: 1, maxLength: 80 }
        cuotaMensual: { type: number, exclusiveMinimum: 0, description: Cuota mensual del crédito. }
        direccion: { type: string, minLength: 1, maxLength: 200, description: Dirección del inmueble. }
        municipio: { type: string, minLength: 1, maxLength: 200 }

    PrecioPoliza:
      type: object
      additionalProperties: false
      required: [edad, datosCredito, origenDatos, tasa, versionTarifa, coberturaMeses, coberturas, vigenciaCotizacion, creadaEn]
      properties:
        edad: { type: integer }
        datosCredito: { $ref: '#/components/schemas/DatosCredito' }
        origenDatos: { $ref: '#/components/schemas/OrigenDatos' }
        tasa: { type: number }
        versionTarifa: { type: integer }
        coberturaMeses: { type: integer }
        coberturas:
          type: array
          items: { $ref: '#/components/schemas/CoberturaContratada' }
        vigenciaCotizacion: { $ref: '#/components/schemas/Vigencia' }
        creadaEn: { type: string, format: date-time }

    DatosVenta:
      type: object
      additionalProperties: false
      required: [direccion, municipio, cuotaMensual]
      properties:
        direccion: { type: string }
        municipio: { type: string }
        cuotaMensual: { type: number }

    DocumentoPoliza:
      type: object
      additionalProperties: false
      required:
      - estado
      properties:
        estado:
          type: string
          enum:
          - GENERANDO
          - LISTO
        url:
          type:
          - string
          - 'null'
          format: uri
          description: Enlace temporal; solo con `LISTO`.
        expiraEn:
          type:
          - string
          - 'null'
          format: date-time
    DocumentoAceptado:
      type: object
      additionalProperties: false
      required:
      - tipo
      - version
      - aceptadoEn
      properties:
        tipo:
          type: string
          enum:
          - poliza
        version:
          type: string
        aceptadoEn:
          type: string
          format: date-time
    Pendiente:
      type: object
      additionalProperties: false
      required:
      - codigo
      - tipo
      - mensaje
      properties:
        codigo:
          $ref: '#/components/schemas/CodigoPendiente'
        tipo:
          $ref: '#/components/schemas/TipoPendiente'
        mensaje:
          type: string
          description: Texto listo para mostrar al cliente.
        detalle:
          type:
          - object
          - 'null'
          additionalProperties: false
          properties:
            evidencias:
              type: array
              items:
                $ref: '#/components/schemas/TipoEvidencia'
              description: En `EVIDENCIA_FALTANTE` y `EVIDENCIA_EN_REVISION`, cuáles.
    EstadoDocumento:
      type: object
      additionalProperties: false
      required:
      - estado
      properties:
        estado:
          type: string
          enum:
          - NO_DISPONIBLE
          - DISPONIBLE
          description: '`DISPONIBLE`: la póliza está emitida y ya se puede pedir el documento (si todavía
            se

            está generando, `GET .../documento` responde 202). `NO_DISPONIBLE`: aún no está emitida.

            '
    OrigenDatos:
      type: string
      enum:
      - CONFIRMADO
      - DECLARADO
      description: '`CONFIRMADO` si el crédito coincide exactamente con una hipoteca reportada por Open Finance;

        `DECLARADO` en cualquier otro caso.

        '
    CodigoCobertura:
      type: string
      enum:
      - VIDA
      - HOGAR
    DocumentoAceptadoEntrada:
      type: object
      additionalProperties: false
      required:
      - tipo
      - version
      properties:
        tipo:
          type: string
          enum:
          - poliza
        version:
          type: string
          pattern: ^V[0-9]+$
          description: Versión del documento legal mostrada (inmutable en Productos), por ejemplo `V1`.

    RegistrarDispositivoRequest:
      type: object
      additionalProperties: false
      required: [token, plataforma, versionApp]
      properties:
        token:
          type: string
          minLength: 8
          maxLength: 4096
          pattern: ^\S+$
          description: Token de Firebase Cloud Messaging de esta instalación de la app.
        plataforma:
          type: string
          enum: [android]
        versionApp:
          type: string
          minLength: 1
          maxLength: 32

    Dispositivo:
      type: object
      additionalProperties: false
      required: [dispositivoId]
      properties:
        dispositivoId: { type: string, format: uuid }

    CrearUsuarioInternoRequest:
      type: object
      additionalProperties: false
      required: [correo, contrasena, rol]
      properties:
        correo:
          type: string
          maxLength: 254
          description: Debe ser del dominio @solventa4bits.com.
        contrasena:
          type: string
          minLength: 8
          maxLength: 128
          writeOnly: true
        rol: { $ref: "#/components/schemas/RolInterno" }
        nombre:
          type: string
          maxLength: 100
          description: Obligatorio para SOCIO; el cliente lo ve en la petición del socio.

    UsuarioInterno:
      type: object
      additionalProperties: false
      required: [uid, correo, rol]
      properties:
        uid:
          type: string
          description: Id en Identity Platform. Para un SOCIO es su socioId.
        correo: { type: string }
        rol: { $ref: "#/components/schemas/RolInterno" }

    RolInterno:
      type: string
      enum: [ADMIN, SOCIO]

    TipoSiniestro:
      type: string
      enum: [INCAPACIDAD_TOTAL, INCENDIO_TERREMOTO, SISMO_PARAMETRICO]
      description: |
        `INCAPACIDAD_TOTAL` es de la cobertura Vida (se paga al banco, sin destino) e
        `INCENDIO_TERREMOTO` de Tu casa (`HOGAR`, con destino del pago y narración).
        `SISMO_PARAMETRICO` lo crea el pago automático por sismo (Tu casa): el cliente no lo
        reporta, así que `ReportarSiniestroDatos.tipo` no lo admite.

    EstadoSiniestro:
      type: string
      enum: [EN_ESTUDIO, FALTA_INFORMACION, PAGADO, RECHAZADO]

    ArchivoReporte:
      type: object
      additionalProperties: false
      required: [clase]
      description: Datos de un archivo, en el mismo orden que las partes `archivos`.
      properties:
        clase: { type: string, enum: [FOTO, DOCUMENTO] }
        capturadoEn: { type: string, format: date-time }
        latitud:
          type: [number, 'null']
          minimum: -90
          maximum: 90
          description: '`null` si el cliente negó el permiso de ubicación.'
        longitud:
          type: [number, 'null']
          minimum: -180
          maximum: 180

    DestinoPago:
      description: Cómo recibe el pago el cliente. Se guarda tal como llega.
      oneOf:
        - type: object
          additionalProperties: false
          required: [tipo, banco, tipoCuenta, numeroCuenta]
          properties:
            tipo: { type: string, const: TRANSFERENCIA }
            banco: { type: string, minLength: 1, maxLength: 100 }
            tipoCuenta: { type: string, enum: [AHORROS, CORRIENTE] }
            numeroCuenta: { type: string, pattern: '^[0-9]{4,20}$' }
        - type: object
          additionalProperties: false
          required: [tipo, oficina]
          properties:
            tipo: { type: string, const: CHEQUE }
            oficina:
              type: object
              additionalProperties: false
              required: [id, banco, nombre, direccion]
              properties:
                id: { type: string, minLength: 1, maxLength: 64 }
                banco: { type: string, minLength: 1, maxLength: 100 }
                nombre: { type: string, minLength: 1, maxLength: 100 }
                direccion: { type: string, minLength: 1, maxLength: 200 }

    ReportarSiniestroDatos:
      type: object
      additionalProperties: false
      required: [polizaId, tipo, fechaOcurrencia, archivos]
      properties:
        polizaId: { type: string, minLength: 1, maxLength: 64 }
        tipo:
          type: string
          enum: [INCAPACIDAD_TOTAL, INCENDIO_TERREMOTO]
          description: 'El paramétrico (`SISMO_PARAMETRICO`) lo crea Solventa: no se reporta.'
        fechaOcurrencia: { type: string, format: date }
        narracion:
          type: string
          maxLength: 4000
          description: Obligatoria en `INCENDIO_TERREMOTO`.
        archivos:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/ArchivoReporte' }
        destinoPago:
          $ref: '#/components/schemas/DestinoPago'
          description: Obligatorio en `INCENDIO_TERREMOTO`; no puede llegar en `INCAPACIDAD_TOTAL`.

    SiniestroReportado:
      type: object
      additionalProperties: false
      required: [id, numero, estado]
      properties:
        id: { type: string, format: uuid }
        numero:
          type: string
          description: El radicado que ve el cliente, p. ej. `SIN-2026-7K3M9Q`.
        estado: { $ref: '#/components/schemas/EstadoSiniestro' }

    ProblemaSiniestro:
      allOf:
      - $ref: '#/components/schemas/Problema'
      - type: object
        properties:
          codigo:
            type: string
            enum:
              - FUERA_DE_VIGENCIA
              - SINIESTRO_EN_CURSO
              - TIPO_NO_CUBIERTO
              - ESTADO_NO_PERMITE
              - VALOR_SUPERA_SUMA_ASEGURADA

    EntregarEvidenciasDatos:
      type: object
      additionalProperties: false
      required: [archivos]
      properties:
        archivos:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: '#/components/schemas/ArchivoReporte' }

    ArchivoSiniestro:
      type: object
      additionalProperties: false
      required: [id, clase, entregadoEn]
      description: Un archivo del siniestro, sin su referencia interna en el bucket.
      properties:
        id: { type: string, format: uuid }
        clase: { type: string, enum: [FOTO, DOCUMENTO] }
        capturadoEn: { type: [string, 'null'], format: date-time }
        latitud: { type: [number, 'null'] }
        longitud: { type: [number, 'null'] }
        entregadoEn:
          type: string
          format: date-time
          description: La fecha de la entrega en que llegó (reporte o lo que se pidió después).

    EvidenciaPedida:
      type: object
      additionalProperties: false
      required: [detalle, pedidaEn]
      properties:
        detalle: { type: string, description: 'Lo que escribió el ADMIN, tal cual lo ve el cliente.' }
        pedidaEn: { type: string, format: date-time }

    LineaPago:
      type: object
      additionalProperties: false
      required: [beneficiario, valor, destino]
      properties:
        beneficiario: { type: string, enum: [BANCO, CLIENTE] }
        valor: { type: number }
        destino:
          type: string
          description: Texto listo para mostrar, p. ej. «Cuenta de ahorros terminada en 4821».

    Pago:
      type: object
      additionalProperties: false
      required: [pagadoEn, lineas]
      description: La orden de pago simulada, una por siniestro, con una o dos líneas.
      properties:
        pagadoEn: { type: string, format: date-time }
        lineas:
          type: array
          items: { $ref: '#/components/schemas/LineaPago' }

    EventoSismo:
      type: object
      additionalProperties: false
      required: [fecha, municipio, magnitud]
      properties:
        fecha: { type: string, format: date }
        municipio: { type: string }
        magnitud: { type: number }

    SiniestroResumen:
      type: object
      additionalProperties: false
      required: [id, numero, polizaId, tipo, automatico, estado, reportadoEn, actualizadoEn]
      examples:
        - id: 3f2b8c1e-7d4a-4e5b-9a61-2c8d5f0b7e14
          numero: SIN-2026-7K3M9Q
          polizaId: 7c1f6a4e-2b8d-4d3a-9a55-0e3b1f2c8d10
          tipo: INCENDIO_TERREMOTO
          automatico: false
          estado: EN_ESTUDIO
          reportadoEn: '2026-11-10T15:02:00Z'
          actualizadoEn: '2026-11-10T15:02:00Z'
      properties:
        id: { type: string, format: uuid }
        numero: { type: string }
        polizaId: { type: string }
        tipo: { $ref: '#/components/schemas/TipoSiniestro' }
        automatico: { type: boolean, description: '`true` en el pago automático por sismo.' }
        estado: { $ref: '#/components/schemas/EstadoSiniestro' }
        reportadoEn: { type: string, format: date-time }
        actualizadoEn: { type: string, format: date-time }

    Siniestro:
      type: object
      additionalProperties: false
      required:
        [id, numero, polizaId, tipo, automatico, estado, reportadoEn, actualizadoEn,
         fechaOcurrencia, ultimaEntregaEn, archivos]
      description: |
        El detalle de un siniestro para el cliente. Tiene los campos del resumen más el plazo, lo que
        Solventa pidió, el motivo del rechazo, la orden de pago y los archivos.
      properties:
        id: { type: string, format: uuid }
        numero: { type: string }
        polizaId: { type: string }
        tipo: { $ref: '#/components/schemas/TipoSiniestro' }
        automatico: { type: boolean, description: '`true` en el pago automático por sismo.' }
        estado: { $ref: '#/components/schemas/EstadoSiniestro' }
        reportadoEn: { type: string, format: date-time }
        actualizadoEn: { type: string, format: date-time }
        fechaOcurrencia: { type: string, format: date }
        narracion: { type: [string, 'null'] }
        ultimaEntregaEn: { type: string, format: date-time }
        fechaLimite:
          type: [string, 'null']
          format: date-time
          description: 'Solo en `EN_ESTUDIO`: la última entrega más un mes (art. 1080).'
        evidenciaPedida:
          oneOf:
            - { $ref: '#/components/schemas/EvidenciaPedida' }
            - { type: 'null' }
        motivoRechazo: { type: [string, 'null'] }
        pago:
          oneOf:
            - { $ref: '#/components/schemas/Pago' }
            - { type: 'null' }
        archivos:
          type: array
          items: { $ref: '#/components/schemas/ArchivoSiniestro' }
        evento:
          oneOf:
            - { $ref: '#/components/schemas/EventoSismo' }
            - { type: 'null' }
          description: Solo en el paramétrico.

    DecidirSiniestroRequest:
      type: object
      additionalProperties: false
      required: [decision, agente]
      properties:
        decision: { type: string, enum: [PAGAR, PEDIR_EVIDENCIA, RECHAZAR] }
        agente:
          type: string
          minLength: 3
          maxLength: 254
          description: El usuario de la sesión del ADMIN. Lo llena el BFF; quien decide no lo escribe.
        dano:
          type: string
          enum: [REPARABLE, PERDIDA_TOTAL]
          description: Obligatorio al pagar Tu casa. No se envía en incapacidad total.
        valor:
          type: number
          exclusiveMinimum: 0
          description: Obligatorio al pagar Tu casa; no puede superar la suma asegurada de HOGAR.
        detalle:
          type: string
          maxLength: 2000
          description: Obligatorio en PEDIR_EVIDENCIA. Es lo que ve el cliente en lo que pedimos.
        motivo:
          type: string
          maxLength: 2000
          description: Obligatorio en RECHAZAR. Es lo que ve el cliente.

    PolizaDelSiniestro:
      type: object
      additionalProperties: false
      required: [id, cobertura, sumaAsegurada]
      properties:
        id: { type: string }
        numero: { type: [string, 'null'] }
        cobertura: { type: string, enum: [VIDA, HOGAR] }
        sumaAsegurada: { type: number }

    SaldoCredito:
      type: object
      additionalProperties: false
      required: [valor, entidad, consultadoEn, origen]
      description: El saldo guardado una sola vez al reportar. Es lo que se paga al banco.
      properties:
        valor: { type: number }
        entidad: { type: string }
        consultadoEn: { type: string, format: date-time }
        origen: { type: string, enum: [OPEN_FINANCE, POLIZA] }

    DecisionSiniestro:
      type: object
      additionalProperties: false
      required: [agente, decision, fecha]
      properties:
        agente: { type: string, description: Quién la tomó, el usuario de la sesión. }
        decision: { type: string, enum: [PAGAR, PEDIR_EVIDENCIA, RECHAZAR] }
        fecha: { type: string, format: date-time }
        dano: { type: [string, 'null'], enum: [REPARABLE, PERDIDA_TOTAL, null] }
        valor: { type: [number, 'null'] }
        detalle: { type: [string, 'null'] }
        motivo: { type: [string, 'null'] }

    SiniestroInternoResumen:
      type: object
      additionalProperties: false
      required:
        [id, numero, clienteId, polizaId, tipo, automatico, estado, reportadoEn, actualizadoEn]
      description: Una fila de la bandeja.
      properties:
        id: { type: string, format: uuid }
        numero: { type: string }
        clienteId: { type: string }
        polizaId: { type: string }
        tipo: { $ref: '#/components/schemas/TipoSiniestro' }
        automatico: { type: boolean }
        estado: { $ref: '#/components/schemas/EstadoSiniestro' }
        reportadoEn: { type: string, format: date-time }
        actualizadoEn: { type: string, format: date-time }
        fechaLimite:
          type: [string, 'null']
          format: date-time
          description: 'Solo en `EN_ESTUDIO`: la última entrega más un mes (art. 1080).'

    SiniestroInterno:
      type: object
      additionalProperties: false
      required:
        [id, numero, clienteId, polizaId, tipo, automatico, estado, reportadoEn, actualizadoEn,
         fechaOcurrencia, ultimaEntregaEn, archivos, poliza, saldoCredito, decisiones]
      description: 'El detalle para el ADMIN. Interno: no sale por el portal del cliente.'
      properties:
        id: { type: string, format: uuid }
        numero: { type: string }
        clienteId: { type: string }
        polizaId: { type: string }
        tipo: { $ref: '#/components/schemas/TipoSiniestro' }
        automatico: { type: boolean }
        estado: { $ref: '#/components/schemas/EstadoSiniestro' }
        reportadoEn: { type: string, format: date-time }
        actualizadoEn: { type: string, format: date-time }
        fechaOcurrencia: { type: string, format: date }
        narracion: { type: [string, 'null'] }
        ultimaEntregaEn: { type: string, format: date-time }
        fechaLimite: { type: [string, 'null'], format: date-time }
        evidenciaPedida:
          oneOf:
            - { $ref: '#/components/schemas/EvidenciaPedida' }
            - { type: 'null' }
        motivoRechazo: { type: [string, 'null'] }
        pago:
          oneOf:
            - { $ref: '#/components/schemas/Pago' }
            - { type: 'null' }
        archivos:
          type: array
          items: { $ref: '#/components/schemas/ArchivoSiniestro' }
        evento:
          oneOf:
            - { $ref: '#/components/schemas/EventoSismo' }
            - { type: 'null' }
        poliza: { $ref: '#/components/schemas/PolizaDelSiniestro' }
        saldoCredito: { $ref: '#/components/schemas/SaldoCredito' }
        destinoPago:
          description: Cómo recibe el pago el cliente, tal como lo eligió al reportar.
          oneOf:
            - { $ref: '#/components/schemas/DestinoPago' }
            - { type: 'null' }
        decisiones:
          type: array
          items: { $ref: '#/components/schemas/DecisionSiniestro' }
