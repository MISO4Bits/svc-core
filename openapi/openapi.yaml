openapi: 3.2.0

info:
  title: ICustomerIdentity — CoreTransaccional
  summary: Identidad y consentimiento de clientes de Solventa.
  description: |
    API **interna** del submódulo *Identidad y Consentimiento* de CoreTransaccional.

    Responsabilidades:
    - Alta y consulta de clientes, enlazados con su identidad de autenticación (`identityRef`).
    - Gestión de consentimientos de acceso a datos por *scope* (Open Finance / Open Data).

    Consumidores:
    - **BFF Web / Móvil** — registro y pasos del journey de originación.
    - **Perfilamiento** — valida el consentimiento vigente antes de construir el perfil (EXP-02).

    No es una API pública. Se expone solo dentro de la malla del clúster; el borde
    (LB → WAF → API Gateway) no la enruta hacia Internet.

    Errores en formato **RFC 9457 (Problem Details)**, `application/problem+json`.
  version: 0.1.0
  contact:
    name: Equipo 4Bits
  license:
    name: Uso académico MISW4501

servers:
  - url: http://svc-core.core.svc.cluster.local
    description: Servicio interno (in-cluster)
  - url: https://core.dev.solventa4bits.com
    description: Entorno de desarrollo (a través del gateway interno)

tags:
  - name: Clientes
    description: Alta y consulta de clientes.
  - name: Consentimientos
    description: Otorgamiento, consulta y revocación de consentimientos por scope.
  - name: Evidencias de identidad
    description: Cédula por ambas caras y selfie previas a la firma (BITS-275).
  - name: Pólizas
    description: Solicitud, consulta y documento de las pólizas de un cliente (BITS-101).
  - name: Pólizas (backoffice)
    description: Cola de pólizas de todos los clientes y decisión del personal de Solventa.

security:
  - serviceAuth: []

paths:
  /v1/clientes:
    get:
      operationId: buscarClientePorIdentidad
      tags: [Clientes]
      summary: Busca un cliente por su identidad de autenticación
      description: |
        Resuelve `identityRef` (el `sub` de Identity Platform) al cliente.
        Lo usa el BFF para asociar la sesión con el `clienteId` tras el login.
      parameters:
        - name: identityRef
          in: query
          required: true
          schema: { type: string, maxLength: 128 }
      responses:
        '200':
          description: Cliente encontrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cliente' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    post:
      operationId: registrarCliente
      tags: [Clientes]
      summary: Registra un cliente
      description: |
        Crea el registro de cliente en estado `ACTIVO` y lo enlaza con la identidad
        de autenticación (`identityRef`). Crea atómicamente los consentimientos
        `OPEN_DATA` (tratamiento de datos personales) y `OPEN_FINANCE` (datos
        financieros) a partir de `autorizaTratamientoDatos` y
        `autorizaDatosFinancieros` — ninguno de los dos bloquea el registro
        (BITS-93 AC-9): declinarlos solo deja el consentimiento correspondiente en
        `NO_OTORGADO`.

        Valida que el dominio del correo no esté en la lista de dominios desechables
        (AC-7) y que ni el correo ni el documento ya existan (AC-5) — responde `409`
        indicando el campo en conflicto sin revelar más datos del otro cliente.

        Idempotente por (`tipoDocumento`, `numeroDocumento`): si el cliente ya existe
        responde `409` sin modificar nada. Con `Idempotency-Key`, un reintento con la
        misma clave devuelve la respuesta original `201`.

        Publica el evento de dominio `ClienteRegistrado` (incluye el resultado del
        consentimiento financiero, lo consume Perfilamiento para decidir si consulta
        Open Finance).

        Tras responder, en segundo plano y sin afectar esta respuesta, prepara los
        correos de **bienvenida** y de **verificación de correo** (plantilla de
        Productos rellenada con los datos del cliente y el enlace a la web) y los
        publica como eventos `EnviarCorreo` para la función `fn-notificaciones`.
        Si algo de eso falla, el registro queda igual; el fallo solo se registra.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistrarClienteRequest' }
      responses:
        '201':
          description: Cliente creado.
          headers:
            Location:
              description: URI del cliente creado.
              schema: { type: string, format: uri-reference }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cliente' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/EntidadNoProcesable' }

  /v1/clientes/disponibilidad:
    get:
      operationId: consultarDisponibilidad
      tags: [Clientes]
      summary: Consulta si un correo y/o documento ya están registrados
      description: |
        Chequeo de solo lectura para validación en vivo del formulario de registro
        (BITS-93). No reemplaza la validación atómica de unicidad que hace
        `POST /v1/clientes` en el momento de crear — esta consulta es una ayuda de UX,
        sujeta a condiciones de carrera.
      parameters:
        - name: correo
          in: query
          required: false
          schema: { type: string, format: email, maxLength: 254 }
        - name: tipoDocumento
          in: query
          required: false
          schema: { $ref: '#/components/schemas/TipoDocumento' }
        - name: numeroDocumento
          in: query
          required: false
          schema: { type: string, minLength: 4, maxLength: 20 }
      responses:
        '200':
          description: Disponibilidad de los campos consultados.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Disponibilidad' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }

  /v1/clientes/{clienteId}/confirmacion:
    parameters:
      - $ref: '#/components/parameters/ClienteId'
    post:
      operationId: confirmarCliente
      tags: [Clientes]
      summary: Confirma el correo del cliente
      description: |
        Transiciona el cliente a `correoConfirmado = true` (BITS-93 AC-3). Lo invoca
        el BFF una vez Identity Platform valida el enlace de activación — el
        vencimiento del enlace lo controla Identity Platform con su comportamiento
        por defecto, esta operación no impone una ventana propia.

        Idempotente: confirmar una cuenta ya confirmada no falla, solo devuelve el
        estado actual sin modificar `confirmadoEn`.
      responses:
        '200':
          description: Cliente confirmado (o ya lo estaba).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cliente' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /v1/clientes/{clienteId}:
    parameters:
      - $ref: '#/components/parameters/ClienteId'
    get:
      operationId: obtenerCliente
      tags: [Clientes]
      summary: Consulta un cliente por id
      responses:
        '200':
          description: Cliente encontrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cliente' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /v1/clientes/{clienteId}/consentimientos:
    parameters:
      - $ref: '#/components/parameters/ClienteId'
    get:
      operationId: listarConsentimientos
      tags: [Consentimientos]
      summary: Lista los consentimientos del cliente
      responses:
        '200':
          description: Consentimientos del cliente (uno por scope registrado).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Consentimiento' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    post:
      operationId: otorgarConsentimiento
      tags: [Consentimientos]
      summary: Otorga o renueva un consentimiento
      description: |
        Registra el otorgamiento de un consentimiento para un scope. Si ya existía
        `OTORGADO`, incrementa `version` y actualiza la marca temporal.

        Publica el evento `ConsentimientoOtorgado`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtorgarConsentimientoRequest' }
      responses:
        '201':
          description: Consentimiento otorgado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Consentimiento' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /v1/clientes/{clienteId}/consentimientos/{scope}:
    parameters:
      - $ref: '#/components/parameters/ClienteId'
      - $ref: '#/components/parameters/Scope'
    get:
      operationId: obtenerConsentimiento
      tags: [Consentimientos]
      summary: Consulta un consentimiento por scope
      responses:
        '200':
          description: Consentimiento.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Consentimiento' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    delete:
      operationId: revocarConsentimiento
      tags: [Consentimientos]
      summary: Revoca un consentimiento
      description: |
        Marca el consentimiento como `REVOCADO` y publica `ConsentimientoRevocado`.

        La propagación a los consumidores (p. ej. expiración de caché en Perfilamiento)
        es asíncrona y debe completarse en ≤ 5 min (NFR de revocación).
      responses:
        '204':
          description: Consentimiento revocado.
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /v1/clientes/{clienteId}/consentimientos/{scope}/estado:
    parameters:
      - $ref: '#/components/parameters/ClienteId'
      - $ref: '#/components/parameters/Scope'
    get:
      operationId: obtenerEstadoConsentimiento
      tags: [Consentimientos]
      summary: Estado efectivo de un consentimiento (consulta rápida)
      description: |
        Respuesta reducida que consume **Perfilamiento** antes de perfilar.
        Optimizada para latencia: solo estado efectivo, versión y vigencia.
      responses:
        '200':
          description: Estado del consentimiento.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EstadoConsentimiento' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /v1/clientes/{clienteId}/evidencias-identidad:
    parameters:
      - $ref: '#/components/parameters/ClienteId'
    post:
      operationId: subirEvidenciaIdentidad
      tags: [Evidencias de identidad]
      summary: Sube una foto de identidad y devuelve el veredicto
      description: |
        Una imagen por request: `tipo` dice qué se sube y `imagen` es el archivo, ya
        comprimido por el cliente (JPEG o PNG, máximo 3 MB).

        El servidor decide si la foto sirve:

        - **`ACEPTADA`** (201): se guarda como evidencia vigente del tipo y reemplaza la
          anterior no consumida. En el reverso de la cédula de ciudadanía (`CC`), solo se
          acepta si el código del reverso contiene el número con el que el cliente se registró.
        - **`REINTENTAR`** (200): no se guarda nada. `motivo` dice qué corregir.
        - **`REVISION_MANUAL`** (201): se guarda y una persona la revisa. Ocurre si no se pudo
          leer el código del reverso o su número no coincide, si el documento no es `CC`, si el
          verificador tardó demasiado o falló, y al **tercer** rechazo de un mismo tipo
          (la foto de ese tercer intento sí se guarda).

        El número leído de la imagen no sale de este servicio. `intentosRestantes` cuenta los
        rechazos que quedan antes de pasar a revisión manual; se reinicia al guardar una evidencia.

        Las fotos rechazadas no se guardan. Las aceptadas se conservan mientras viva la póliza
        que las referencie; una evidencia consumida por una póliza no se reutiliza en otra.

        **Selfie (`tipo = selfie`).** Se compara con el frente de la cédula ya guardado, así que
        ambas caras deben estar vigentes (`ACEPTADA` o `REVISION_MANUAL`); si no, responde **422**
        y no cuenta como intento. El servidor revisa la calidad, que haya un solo rostro, que sea
        una persona real (prueba de vida pasiva) y que coincida con el de la cédula. Cada puntaje
        tiene dos umbrales: bajo el inferior se rechaza (`SIN_ROSTRO`, `VARIOS_ROSTROS`,
        `POSIBLE_SUPLANTACION`, `NO_COINCIDE_CON_CEDULA`, además de `BORROSA` y `OSCURA`), sobre el
        superior se acepta y en medio decide una persona (`REVISION_MANUAL`). Si no se halla un
        rostro en la cédula, o la verificación tarda o falla, también va a `REVISION_MANUAL`.
        Los puntajes se guardan para quien revise, pero no salen en la respuesta.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/SubirEvidenciaRequest' }
      responses:
        '200':
          description: La foto no sirve (`estado = REINTENTAR`). No se creó ninguna evidencia.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenciaSubida' }
        '201':
          description: Evidencia guardada (`ACEPTADA` o `REVISION_MANUAL`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenciaSubida' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '413':
          description: La imagen supera el máximo permitido.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '422':
          description: Se subió la selfie sin que ambas caras de la cédula estén vigentes.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
    get:
      operationId: obtenerEstadoEvidenciasIdentidad
      tags: [Evidencias de identidad]
      summary: Estado vigente de cada tipo de evidencia
      description: |
        Siempre devuelve los tres tipos. `PENDIENTE` significa que no hay evidencia vigente
        (nunca se subió, o la consumió una póliza). Sirve para retomar el flujo y para habilitar
        el paso a la firma: ambas caras de la cédula en `ACEPTADA` o `REVISION_MANUAL`.
      responses:
        '200':
          description: Estado por tipo.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EstadoTipoEvidencia' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /v1/clientes/{clienteId}/polizas:
    parameters:
    - $ref: '#/components/parameters/ClienteId'
    post:
      operationId: solicitarPoliza
      tags:
      - Pólizas
      summary: Solicita la póliza de la cotización activa de un cliente
      description: Misma semántica y mismas respuestas que `POST /v1/cuenta/polizas`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitarPolizaRequest'
      responses:
        '200':
          description: Ya existía.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Poliza'
        '201':
          description: Creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Poliza'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/ConflictoPoliza'
        '422':
          $ref: '#/components/responses/FueraDeRango'
        '503':
          $ref: '#/components/responses/NoDisponible'
      security:
      - serviceAuth: []
    get:
      operationId: listarPolizasDeCliente
      tags:
      - Pólizas
      summary: Lista las pólizas de un cliente
      parameters:
      - $ref: '#/components/parameters/EstadoPolizaFiltro'
      responses:
        '200':
          description: Pólizas del cliente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Poliza'
        '404':
          $ref: '#/components/responses/NoEncontrado'
      security:
      - serviceAuth: []
  /v1/clientes/{clienteId}/polizas/{polizaId}:
    parameters:
    - $ref: '#/components/parameters/ClienteId'
    - $ref: '#/components/parameters/PolizaId'
    get:
      operationId: obtenerPolizaDeCliente
      tags:
      - Pólizas
      summary: Consulta una póliza de un cliente (re-evalúa si está pendiente)
      responses:
        '200':
          description: La póliza.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Poliza'
        '404':
          $ref: '#/components/responses/NoEncontrado'
      security:
      - serviceAuth: []
  /v1/clientes/{clienteId}/polizas/{polizaId}/documento:
    parameters:
    - $ref: '#/components/parameters/ClienteId'
    - $ref: '#/components/parameters/PolizaId'
    get:
      operationId: obtenerDocumentoPolizaDeCliente
      tags:
      - Pólizas
      summary: Documento de una póliza emitida
      description: Misma semántica y respuestas que `GET /v1/cuenta/polizas/{polizaId}/documento`.
      responses:
        '200':
          description: Listo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentoPoliza'
        '202':
          description: Generándose.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentoPoliza'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: No está emitida.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaPoliza'
        '503':
          $ref: '#/components/responses/NoDisponible'
      security:
      - serviceAuth: []
  /v1/polizas:
    get:
      operationId: listarPolizas
      tags:
      - Pólizas (backoffice)
      summary: Lista pólizas de todos los clientes, filtradas por estado
      description: 'Cola de trabajo del agente. Orden por `creadaEn`; por defecto de la **más antigua**
        a la

        más reciente, para atender primero lo que lleva más esperando.


        `estado = VENCIDA` es derivado: pólizas `PENDIENTE` con `solicitudVigenteHasta` ya pasada.

        Para ver solo lo que espera a una persona: `estado=PENDIENTE&tipoPendiente=AGENTE`.

        '
      parameters:
      - name: estado
        in: query
        schema:
          $ref: '#/components/schemas/EstadoPoliza'
      - name: tipoPendiente
        in: query
        description: Solo pólizas con al menos un pendiente de este tipo.
        schema:
          $ref: '#/components/schemas/TipoPendiente'
      - name: codigoPendiente
        in: query
        schema:
          $ref: '#/components/schemas/CodigoPendiente'
      - name: clienteId
        in: query
        schema:
          type: string
          format: uuid
      - name: creadaDesde
        in: query
        schema:
          type: string
          format: date-time
      - name: creadaHasta
        in: query
        schema:
          type: string
          format: date-time
      - name: orden
        in: query
        schema:
          type: string
          enum:
          - creadaEn
          - -creadaEn
          default: creadaEn
      - name: limite
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - name: cursor
        in: query
        description: Valor `siguienteCursor` de la página anterior.
        schema:
          type: string
          maxLength: 256
      responses:
        '200':
          description: Una página de pólizas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaPolizas'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
      security:
      - serviceAuth: []
  /v1/polizas/{polizaId}:
    parameters:
    - $ref: '#/components/parameters/PolizaId'
    get:
      operationId: obtenerPolizaInterna
      tags:
      - Pólizas (backoffice)
      summary: Detalle de una póliza para quien la revisa
      description: 'Incluye lo que el cliente no ve: evidencias referenciadas, aprobaciones ya registradas
        y los

        datos de la cotización usada. No re-evalúa: muestra el último estado calculado.

        '
      responses:
        '200':
          description: Detalle interno.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolizaInterna'
        '404':
          $ref: '#/components/responses/NoEncontrado'
      security:
      - serviceAuth: []
  /v1/polizas/{polizaId}/decisiones:
    parameters:
    - $ref: '#/components/parameters/PolizaId'
    post:
      operationId: decidirPoliza
      tags:
      - Pólizas (backoffice)
      summary: Aprueba pendientes o rechaza una póliza
      description: "El personal de Solventa toma una decisión sobre una póliza `PENDIENTE`:\n\n- **`APROBAR`**:\
        \ registra que verificó los `pendientes` indicados (solo de tipo `AGENTE`:\n  `EVIDENCIA_EN_REVISION`\
        \ y/o `CREDITO_NO_VERIFICADO`) y **re-evalúa**. Si ya no queda\n  ningún pendiente (tampoco de usuario),\
        \ la póliza pasa a `EMITIDA` en la misma operación;\n  si no, sigue `PENDIENTE` con lo que falta.\
        \ Repetir una aprobación ya registrada no cambia\n  nada.\n- **`RECHAZAR`**: la póliza pasa a `RECHAZADA`\
        \ (terminal). `pendientes` indica el\n  escenario que motiva el rechazo, y de él sale el mensaje\
        \ que ve el cliente (no hay texto\n  libre). Se puede rechazar aunque queden pendientes de usuario.\
        \ Las evidencias no se\n  consumen.\n\nMensajes al cliente por escenario:\n\n- `CREDITO_NO_VERIFICADO`:\
        \ «No pudimos verificar los datos de tu crédito con la entidad\n  acreedora.»\n- `EVIDENCIA_EN_REVISION`:\
        \ «No pudimos validar tu identidad con los documentos que\n  enviaste.»\n\nCada decisión queda registrada\
        \ con quién, cuándo y la nota interna.\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
            examples:
              aprobar:
                value:
                  decision: APROBAR
                  agente: maria.gomez@solventa.co
                  pendientes:
                  - CREDITO_NO_VERIFICADO
                  nota: Saldo y plazo confirmados con el certificado del banco.
              rechazar:
                value:
                  decision: RECHAZAR
                  agente: maria.gomez@solventa.co
                  pendientes:
                  - CREDITO_NO_VERIFICADO
                  nota: El banco no reconoce el número de crédito.
      responses:
        '200':
          description: Decisión registrada; póliza re-evaluada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolizaInterna'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: La póliza no está `PENDIENTE` (`codigo = POLIZA_NO_PENDIENTE`) o ya venció (`SOLICITUD_VENCIDA`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaPoliza'
        '422':
          description: 'Un pendiente indicado no aplica: la póliza no lo tiene (`codigo = PENDIENTE_NO_APLICA`).

            '
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaPoliza'
      security:
      - serviceAuth: []

components:

  securitySchemes:
    serviceAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token de identidad de servicio emitido por la malla / gateway interno.
        No se aceptan tokens de cliente final directamente contra esta API.

  parameters:
    ClienteId:
      name: clienteId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Scope:
      name: scope
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ConsentimientoScope' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Clave de idempotencia para reintentos seguros del alta.
      schema: { type: string, maxLength: 64 }

    PolizaId:
      name: polizaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EstadoPolizaFiltro:
      name: estado
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/EstadoPoliza'

  responses:
    SolicitudInvalida:
      description: Solicitud mal formada o con validación de esquema fallida.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    NoEncontrado:
      description: El recurso no existe.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    Conflicto:
      description: Ya existe un cliente para ese documento o ese correo (ver `errores[].campo`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    EntidadNoProcesable:
      description: La solicitud es válida pero incumple una regla de negocio.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }

    ConflictoPoliza:
      description: '`SIN_COTIZACION` (el cliente no tiene cotización activa), `COTIZACION_VENCIDA`,

        `COTIZACION_CAMBIO` (la activa no es la que el cliente vio: volver a mostrarla),

        `SOLICITUD_EXISTENTE` (ya hay una solicitud de esa cotización con otras coberturas) o

        `SOLICITUD_RECHAZADA` (esa solicitud fue rechazada por un agente).

        '
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemaPoliza'
    NoDisponible:
      description: Cotización no disponible (`codigo = COTIZACION_NO_DISPONIBLE`). Reintentar; no se emite
        nada.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemaPoliza'
    Prohibido:
      description: El cliente no está `ACTIVO` (`codigo = CLIENTE_NO_ACTIVO`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemaPoliza'
    FueraDeRango:
      description: Edad o plazo fuera de rango (`codigo = FUERA_DE_RANGO`). No se crea la solicitud.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemaPoliza'

  schemas:

    RegistrarClienteRequest:
      type: object
      additionalProperties: false
      required: [identityRef, tipoDocumento, numeroDocumento, primerNombre, primerApellido, fechaNacimiento, email, telefono, canal, autorizaTratamientoDatos, autorizaDatosFinancieros]
      properties:
        identityRef:
          type: string
          maxLength: 128
          description: Identificador de la identidad de autenticación (`sub` de Identity Platform).
        tipoDocumento: { $ref: '#/components/schemas/TipoDocumento' }
        numeroDocumento:
          type: string
          minLength: 4
          maxLength: 20
          pattern: '^[0-9A-Za-z-]+$'
        primerNombre: { type: string, minLength: 1, maxLength: 60 }
        segundoNombre:
          type: [string, 'null']
          maxLength: 60
        primerApellido: { type: string, minLength: 1, maxLength: 60 }
        segundoApellido:
          type: [string, 'null']
          maxLength: 60
        fechaNacimiento: { type: string, format: date }
        email: { type: string, format: email, maxLength: 254 }
        telefono:
          type: string
          pattern: '^\+?[0-9]{7,15}$'
          description: Celular de contacto (obligatorio desde BITS-93).
        canal:
          $ref: '#/components/schemas/Canal'
          description: Canal desde el que se registra, para el consentimiento (igual que en otorgarConsentimiento).
        autorizaTratamientoDatos:
          type: boolean
          description: |
            Consentimiento OPEN_DATA (tratamiento de datos personales) otorgado en el
            propio registro (BITS-93). `false` no bloquea el registro; solo deja el
            consentimiento en `NO_OTORGADO`.
        politicaVersionTratamientoDatos:
          type: [string, 'null']
          maxLength: 20
          description: Versión del aviso de tratamiento de datos aceptado. Solo aplica si se autoriza.
        autorizaDatosFinancieros:
          type: boolean
          description: |
            Consentimiento OPEN_FINANCE otorgado en el propio registro (BITS-93 AC-9).
            `false` no bloquea el registro; solo deja el consentimiento en `NO_OTORGADO`.
        politicaVersionDatosFinancieros:
          type: [string, 'null']
          maxLength: 20
          description: Versión de la autorización de datos financieros aceptada. Solo aplica si se autoriza.

    Cliente:
      type: object
      additionalProperties: false
      required: [id, identityRef, tipoDocumento, numeroDocumento, primerNombre, primerApellido, fechaNacimiento, email, telefono, estado, correoConfirmado, creadoEn]
      properties:
        id: { type: string, format: uuid }
        identityRef: { type: string }
        tipoDocumento: { $ref: '#/components/schemas/TipoDocumento' }
        numeroDocumento: { type: string }
        primerNombre: { type: string }
        segundoNombre: { type: [string, 'null'] }
        primerApellido: { type: string }
        segundoApellido: { type: [string, 'null'] }
        fechaNacimiento: { type: string, format: date }
        email: { type: string, format: email }
        telefono: { type: string }
        estado: { $ref: '#/components/schemas/EstadoCliente' }
        correoConfirmado:
          type: boolean
          description: BITS-93 AC-3 — no condiciona cotización ni coberturas, solo la formalización del contrato.
        confirmadoEn: { type: [string, 'null'], format: date-time }
        creadoEn: { type: string, format: date-time }
        actualizadoEn: { type: [string, 'null'], format: date-time }

    Disponibilidad:
      type: object
      additionalProperties: false
      properties:
        correoDisponible: { type: [boolean, 'null'], description: 'null si no se consultó correo.' }
        documentoDisponible: { type: [boolean, 'null'], description: 'null si no se consultó documento.' }

    OtorgarConsentimientoRequest:
      type: object
      additionalProperties: false
      required: [scope, politicaVersion, canal]
      properties:
        scope: { $ref: '#/components/schemas/ConsentimientoScope' }
        politicaVersion:
          type: string
          maxLength: 20
          description: Versión del texto de política/consentimiento aceptado por el cliente.
        canal: { $ref: '#/components/schemas/Canal' }

    Consentimiento:
      type: object
      additionalProperties: false
      required: [scope, estado, version, actualizadoEn]
      properties:
        scope: { $ref: '#/components/schemas/ConsentimientoScope' }
        estado: { $ref: '#/components/schemas/EstadoConsentimientoEnum' }
        version: { type: integer, minimum: 1 }
        politicaVersion: { type: [string, 'null'] }
        canal: { $ref: '#/components/schemas/Canal' }
        otorgadoEn: { type: [string, 'null'], format: date-time }
        revocadoEn: { type: [string, 'null'], format: date-time }
        actualizadoEn: { type: string, format: date-time }

    EstadoConsentimiento:
      type: object
      additionalProperties: false
      required: [scope, estado, version, vigente]
      properties:
        scope: { $ref: '#/components/schemas/ConsentimientoScope' }
        estado: { $ref: '#/components/schemas/EstadoConsentimientoEnum' }
        version: { type: integer, minimum: 1 }
        vigente:
          type: boolean
          description: true si el estado efectivo habilita el acceso a datos de ese scope.

    TipoDocumento:
      type: string
      enum: [CC, CE, PA, NIT]
    EstadoCliente:
      type: string
      enum: [ACTIVO, BLOQUEADO, INACTIVO]
    ConsentimientoScope:
      type: string
      enum: [OPEN_FINANCE, OPEN_DATA]
    EstadoConsentimientoEnum:
      type: string
      enum: [OTORGADO, REVOCADO, NO_OTORGADO]
    Canal:
      type: string
      enum: [WEB, MOVIL, BACKOFFICE]

    TipoEvidencia:
      type: string
      enum: [cedula_frente, cedula_reverso, selfie]
    EstadoEvidencia:
      type: string
      enum: [ACEPTADA, REINTENTAR, REVISION_MANUAL]
    MotivoRechazo:
      type: string
      enum:
        - BORROSA
        - OSCURA
        - REFLEJO
        - RECORTADA
        - NO_ES_CEDULA
        - SIN_ROSTRO
        - VARIOS_ROSTROS
        - POSIBLE_SUPLANTACION
        - NO_COINCIDE_CON_CEDULA
      description: |
        `REFLEJO` incluye la sobreexposición global. `BORROSA` incluye la foto con muy pocos
        píxeles. `NO_ES_CEDULA` es que no se halló un rectángulo con la proporción de una tarjeta.

        Los cuatro últimos son de la selfie. `SIN_ROSTRO` incluye un rostro demasiado pequeño;
        `VARIOS_ROSTROS` es más de una persona en la foto; `POSIBLE_SUPLANTACION` es que la prueba
        de vida pasiva no cree que sea una persona real (foto de una foto o de una pantalla);
        `NO_COINCIDE_CON_CEDULA` es que el rostro no se parece al de la cédula.
        Los clientes deben tolerar motivos que no conozcan.

    SubirEvidenciaRequest:
      type: object
      required: [tipo, imagen]
      properties:
        tipo: { $ref: '#/components/schemas/TipoEvidencia' }
        imagen: { type: string, format: binary, description: Foto en JPEG o PNG, máximo 3 MB. }

    EvidenciaSubida:
      type: object
      additionalProperties: false
      required: [tipo, estado, intentosRestantes]
      properties:
        evidenciaId:
          type: [string, 'null']
          format: uuid
          description: "`null` con `REINTENTAR`: no se guardó nada."
        tipo: { $ref: '#/components/schemas/TipoEvidencia' }
        estado: { $ref: '#/components/schemas/EstadoEvidencia' }
        motivo:
          oneOf:
            - { $ref: '#/components/schemas/MotivoRechazo' }
            - { type: 'null' }
          description: Solo con `REINTENTAR`.
        intentosRestantes: { type: integer, minimum: 0 }

    EstadoTipoEvidencia:
      type: object
      additionalProperties: false
      required: [tipo, estado, intentosRestantes]
      properties:
        tipo: { $ref: '#/components/schemas/TipoEvidencia' }
        estado: { type: string, enum: [ACEPTADA, REVISION_MANUAL, PENDIENTE] }
        evidenciaId: { type: [string, 'null'], format: uuid }
        creadaEn: { type: [string, 'null'], format: date-time }
        intentosRestantes: { type: integer, minimum: 0 }

    Problema:
      description: Error en formato RFC 9457 (Problem Details for HTTP APIs).
      type: object
      properties:
        type: { type: string, format: uri, default: 'about:blank' }
        title: { type: string }
        status: { type: integer, minimum: 100, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        errores:
          type: array
          description: Detalle por campo cuando aplica (validación).
          items:
            type: object
            properties:
              campo: { type: string }
              mensaje: { type: string }

    ProblemaPoliza:
      allOf:
      - $ref: '#/components/schemas/Problema'
      - type: object
        properties:
          codigo:
            type: string
            enum:
            - CLIENTE_NO_ACTIVO
            - SIN_COTIZACION
            - COTIZACION_VENCIDA
            - COTIZACION_CAMBIO
            - COTIZACION_NO_DISPONIBLE
            - FUERA_DE_RANGO
            - SOLICITUD_EXISTENTE
            - SOLICITUD_RECHAZADA
            - POLIZA_NO_EMITIDA
            - POLIZA_NO_PENDIENTE
            - SOLICITUD_VENCIDA
            - PENDIENTE_NO_APLICA
            - DOCUMENTO_NO_DISPONIBLE
    CodigoPendiente:
      type: string
      enum:
      - CORREO_SIN_CONFIRMAR
      - EVIDENCIA_FALTANTE
      - EVIDENCIA_EN_REVISION
      - CREDITO_NO_VERIFICADO
    Poliza:
      type: object
      required:
      - polizaId
      - estado
      - producto
      - creadaEn
      - coberturas
      - primaTotalMensual
      - moneda
      - datosCredito
      - origenDatos
      - cotizacionCreadaEn
      - pendientes
      - documento
      properties:
        polizaId:
          type: string
          format: uuid
        numero:
          type:
          - string
          - 'null'
          example: SOL-VH-2026-K7M2Q9
          description: Solo cuando está `EMITIDA`.
        estado:
          $ref: '#/components/schemas/EstadoPoliza'
        producto:
          type: string
          enum:
          - VIDA_HIPOTECARIO
        creadaEn:
          type: string
          format: date-time
        emitidaEn:
          type:
          - string
          - 'null'
          format: date-time
        solicitudVigenteHasta:
          type:
          - string
          - 'null'
          format: date-time
          description: 'Fin de la vigencia de la cotización atada. Una solicitud `PENDIENTE` pasa a `VENCIDA`

            después de esta fecha. `null` si está `EMITIDA`.

            '
        vigencia:
          oneOf:
          - $ref: '#/components/schemas/Vigencia'
          - type: 'null'
          description: Vigencia de la cobertura; solo cuando está `EMITIDA`.
        coberturas:
          type: array
          items:
            $ref: '#/components/schemas/CoberturaContratada'
        primaTotalMensual:
          type: number
        moneda:
          type: string
          enum:
          - COP
        datosCredito:
          $ref: '#/components/schemas/DatosCredito'
        origenDatos:
          $ref: '#/components/schemas/OrigenDatos'
        cotizacionCreadaEn:
          type: string
          format: date-time
        pendientes:
          type: array
          description: Vacía cuando está `EMITIDA`.
          items:
            $ref: '#/components/schemas/Pendiente'
        documento:
          $ref: '#/components/schemas/EstadoDocumento'
        documentosAceptados:
          type: array
          items:
            $ref: '#/components/schemas/DocumentoAceptado'
        rechazo:
          type:
          - object
          - 'null'
          additionalProperties: false
          required:
          - motivos
          - rechazadaEn
          description: Solo cuando está `RECHAZADA`.
          properties:
            motivos:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                required:
                - codigo
                - mensaje
                properties:
                  codigo:
                    $ref: '#/components/schemas/CodigoPendienteDeAgente'
                  mensaje:
                    type: string
                    description: Texto fijo del escenario
                    listo para mostrar.: null
            rechazadaEn:
              type: string
              format: date-time
    SolicitarPolizaRequest:
      type: object
      additionalProperties: false
      required:
      - coberturas
      - cotizacionCreadaEn
      - documentosAceptados
      properties:
        coberturas:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/CodigoCobertura'
          description: Debe incluir `VIDA` (obligatoria). `HOGAR` es opcional.
        cotizacionCreadaEn:
          type: string
          format: date-time
          description: '`creadaEn` de la cotización que el cliente tiene en pantalla. Si no coincide con la

            activa, responde 409 `COTIZACION_CAMBIO`: el cliente no paga un precio que no vio.

            '
        documentosAceptados:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DocumentoAceptadoEntrada'
          description: 'Documentos legales que la interfaz mostró y el cliente aceptó. Debe incluir el tipo

            `poliza`. Se guardan con fecha de aceptación. No se valida que la versión exista en

            Productos, igual que las versiones de política del registro.

            '
    CoberturaContratada:
      type: object
      additionalProperties: false
      required:
      - codigo
      - obligatoria
      - sumaAsegurada
      - primaNeta
      - iva
      - primaTotal
      properties:
        codigo:
          $ref: '#/components/schemas/CodigoCobertura'
        obligatoria:
          type: boolean
        sumaAsegurada:
          type: number
        primaNeta:
          type: number
        iva:
          type: number
        primaTotal:
          type: number
    DatosCredito:
      type: object
      additionalProperties: false
      required:
      - valorCredito
      - plazoRestanteMeses
      - entidadAcreedora
      - saldoInsoluto
      properties:
        valorCredito:
          type: number
        plazoRestanteMeses:
          type: integer
        entidadAcreedora:
          type: string
        saldoInsoluto:
          type: number
    EstadoPoliza:
      type: string
      enum:
      - PENDIENTE
      - EMITIDA
      - RECHAZADA
      - VENCIDA
      description: '`VENCIDA` se deriva al leer; no se guarda.'
    CodigoPendienteDeAgente:
      type: string
      enum:
      - EVIDENCIA_EN_REVISION
      - CREDITO_NO_VERIFICADO
    TipoPendiente:
      type: string
      enum:
      - USUARIO
      - AGENTE
    PaginaPolizas:
      type: object
      additionalProperties: false
      required:
      - items
      - siguienteCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PolizaResumen'
        siguienteCursor:
          type:
          - string
          - 'null'
          description: '`null` en la última página.'
    Vigencia:
      type: object
      additionalProperties: false
      required:
      - desde
      - hasta
      properties:
        desde:
          type: string
          format: date-time
        hasta:
          type: string
          format: date-time
    PolizaResumen:
      type: object
      additionalProperties: false
      required:
      - polizaId
      - clienteId
      - estado
      - creadaEn
      - primaTotalMensual
      - origenDatos
      - pendientes
      properties:
        polizaId:
          type: string
          format: uuid
        numero:
          type:
          - string
          - 'null'
        clienteId:
          type: string
          format: uuid
        estado:
          $ref: '#/components/schemas/EstadoPoliza'
        creadaEn:
          type: string
          format: date-time
        solicitudVigenteHasta:
          type:
          - string
          - 'null'
          format: date-time
        primaTotalMensual:
          type: number
        origenDatos:
          $ref: '#/components/schemas/OrigenDatos'
        pendientes:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - codigo
            - tipo
            properties:
              codigo:
                $ref: '#/components/schemas/CodigoPendiente'
              tipo:
                $ref: '#/components/schemas/TipoPendiente'
    DecisionRequest:
      type: object
      additionalProperties: false
      required:
      - decision
      - agente
      - pendientes
      properties:
        decision:
          type: string
          enum:
          - APROBAR
          - RECHAZAR
        agente:
          type: string
          maxLength: 128
          description: Correo o identificador de la persona de Solventa que decide.
        pendientes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/CodigoPendienteDeAgente'
          description: 'Con `APROBAR`, los pendientes que el agente verificó. Con `RECHAZAR`, el escenario
            que

            motiva el rechazo, del que sale el mensaje al cliente.

            '
        nota:
          type: string
          maxLength: 500
          description: Interna; el cliente no la ve.
    PolizaInterna:
      unevaluatedProperties: false
      description: La póliza que ve el cliente más lo que solo ve quien la revisa.
      allOf:
      - $ref: '#/components/schemas/Poliza'
      - type: object
        required:
        - clienteId
        - evidencias
        - decisiones
        properties:
          clienteId:
            type: string
            format: uuid
          ultimaEvaluacionEn:
            type:
            - string
            - 'null'
            format: date-time
          tasa:
            type: number
          versionTarifa:
            type: integer
          evidencias:
            type: array
            description: Estado vigente de cada tipo de evidencia del cliente.
            items:
              type: object
              additionalProperties: false
              required:
              - tipo
              - estado
              properties:
                tipo:
                  $ref: '#/components/schemas/TipoEvidencia'
                estado:
                  type: string
                  enum:
                  - ACEPTADA
                  - REVISION_MANUAL
                  - PENDIENTE
                evidenciaId:
                  type:
                  - string
                  - 'null'
                  format: uuid
          decisiones:
            type: array
            description: Historial de decisiones del personal de Solventa, de la más antigua a la más reciente.
            items:
              type: object
              additionalProperties: false
              required:
              - decision
              - agente
              - decididaEn
              properties:
                decision:
                  type: string
                  enum:
                  - APROBAR
                  - RECHAZAR
                agente:
                  type: string
                pendientes:
                  type: array
                  items:
                    $ref: '#/components/schemas/CodigoPendienteDeAgente'
                nota:
                  type:
                  - string
                  - 'null'
                decididaEn:
                  type: string
                  format: date-time
    DocumentoPoliza:
      type: object
      additionalProperties: false
      required:
      - estado
      properties:
        estado:
          type: string
          enum:
          - GENERANDO
          - LISTO
        url:
          type:
          - string
          - 'null'
          format: uri
          description: Enlace temporal; solo con `LISTO`.
        expiraEn:
          type:
          - string
          - 'null'
          format: date-time
    DocumentoAceptado:
      type: object
      additionalProperties: false
      required:
      - tipo
      - version
      - aceptadoEn
      properties:
        tipo:
          type: string
          enum:
          - poliza
        version:
          type: string
        aceptadoEn:
          type: string
          format: date-time
    Pendiente:
      type: object
      additionalProperties: false
      required:
      - codigo
      - tipo
      - mensaje
      properties:
        codigo:
          $ref: '#/components/schemas/CodigoPendiente'
        tipo:
          $ref: '#/components/schemas/TipoPendiente'
        mensaje:
          type: string
          description: Texto listo para mostrar al cliente.
        detalle:
          type:
          - object
          - 'null'
          additionalProperties: false
          properties:
            evidencias:
              type: array
              items:
                $ref: '#/components/schemas/TipoEvidencia'
              description: En `EVIDENCIA_FALTANTE` y `EVIDENCIA_EN_REVISION`, cuáles.
    EstadoDocumento:
      type: object
      additionalProperties: false
      required:
      - estado
      properties:
        estado:
          type: string
          enum:
          - NO_DISPONIBLE
          - DISPONIBLE
          description: '`DISPONIBLE`: la póliza está emitida y ya se puede pedir el documento (si todavía
            se

            está generando, `GET .../documento` responde 202). `NO_DISPONIBLE`: aún no está emitida.

            '
    OrigenDatos:
      type: string
      enum:
      - CONFIRMADO
      - DECLARADO
      description: '`CONFIRMADO` si el crédito coincide exactamente con una hipoteca reportada por Open Finance;

        `DECLARADO` en cualquier otro caso.

        '
    CodigoCobertura:
      type: string
      enum:
      - VIDA
      - HOGAR
    DocumentoAceptadoEntrada:
      type: object
      additionalProperties: false
      required:
      - tipo
      - version
      properties:
        tipo:
          type: string
          enum:
          - poliza
        version:
          type: string
          pattern: ^V[0-9]+$
          description: Versión del documento legal mostrada (inmutable en Productos), por ejemplo `V1`.
